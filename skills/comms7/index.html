s.\",\n            \"en\": \"If you ask for a skill or workflow explanation, AI works on the explanation. A communication review starts when that is your goal.\"\n          }\n        ],\n        \"what\": {\n          \"lv\": \"Čatā ieraksti COMMS7. AI ielādē prasmi un tās darba kārtību. Vari uzreiz pateikt, ko vēlies pārskatīt: svarīgāko kopumā, Action, Waiting vai vienu konkrētu sarunu.\",\n          \"en\": \"Type COMMS7 in chat. AI loads the skill and its instructions. You can ask for the overall priorities, Action, Waiting or a specific conversation.\"\n        },\n        \"out\": {\n          \"lv\": \"AI saprot, kādu palīdzību tu vēlies.\",\n          \"en\": \"AI understands the help you want.\"\n        },\n        \"files\": [\n          \"SKILL.md\"\n        ],\n        \"example\": {\n          \"lv\": \"COMMS7 — kas man šobrīd svarīgākais Gmail un WhatsApp?  /  COMMS7 — pārskati aktuālo Waiting.\",\n          \"en\": \"COMMS7 — what matters now in Gmail and WhatsApp?  /  COMMS7 — review current Waiting.\"\n        },\n        \"summary\": {\n          \"lv\": \"Čatā pasaki, ko vēlies pārskatīt. AI ielādē COMMS7.\",\n          \"en\": \"Tell the chat what to review. AI loads COMMS7.\"\n        },\n        \"headerIcons\": [\n          \"user\"\n        ]\n      },\n      {\n        \"id\": \"scope\",\n        \"x\": 210,\n        \"y\": 300,\n        \"kind\": \"ai\",\n        \"icon\": \"ai\",\n        \"step\": 2,\n        \"min\": true,\n        \"label\": {\n          \"lv\": \"Vienojamies par tvērumu\",\n          \"en\": \"Agree on scope\"\n        },\n        \"actor\": {\n          \"lv\": \"AI · ar tevi\",\n          \"en\": \"AI · with you\"\n        },\n        \"paragraphs\": [\n          {\n            \"lv\": \"AI izmanto jau pateikto, iepriekšējos lēmumus un Business darba kontekstu. Vienojas par mērķi, kanāliem, kontiem un apskata dziļumu; jau atbildēto nejautā vēlreiz.\",\n            \"en\": \"AI uses your request, previous decisions and Business context. Agree on the goal, channels, accounts and review depth; do not ask again for information already supplied.\"\n          },\n          {\n            \"lv\": \"Ja ieraksti tikai “COMMS7”, AI piedāvā saprātīgu sākumu, piemēram, svarīgākos neatbildētos jautājumus un atvērtos solījumus. Papildu jautājumu uzdod tad, ja atbilde mainītu to, ko pārbaudīt.\",\n            \"en\": \"If you type only “COMMS7”, AI proposes a useful starting point, such as important unanswered requests and open promises. It asks a follow-up when the answer changes what should be reviewed.\"\n          },\n          {\n            \"lv\": \"FOCUS7 pašreizējās prioritātes palīdz noteikt svarīgumu. CRM7 dod atrastā cilvēka pēdējo profesionālo kontekstu, ja pieejams piešķirts lasītājs. Tas pats nepiešķir jaunu CRM rakstīšanu.\",\n            \"en\": \"Current FOCUS7 priorities inform importance. CRM7 provides the matched person’s latest professional context where a granted reader is available. Reading does not grant CRM writes.\"\n          }\n        ],\n        \"what\": {\n          \"lv\": \"AI izmanto jau pateikto, iepriekšējos lēmumus un Business darba kontekstu. Vienojas par mērķi, kanāliem, kontiem un apskata dziļumu; jau atbildēto nejautā vēlreiz.\",\n          \"en\": \"AI uses your request, previous decisions and Business context. Agree on the goal, channels, accounts and review depth; do not ask again for information already supplied.\"\n        },\n        \"out\": {\n          \"lv\": \"Skaidrs, ko šajā apskatā pārbaudām un kādu rezultātu gaidām.\",\n          \"en\": \"A clear review scope and expected result.\"\n        },\n        \"files\": [\n          \"SKILL.md\",\n          \"references/RUN-CONTRACT.md\",\n          \"references/PRINCIPLES.md\",\n          \"references/AIOS-INTEGRATION.md\"\n        ],\n        \"summary\": {\n          \"lv\": \"AI izmanto jau pateikto un precizē tikai to, kas tiešām maina apskatu.\",\n          \"en\": \"AI uses what you already said and asks only for details that change the review.\"\n        },\n        \"headerIcons\": [\n          \"ai\"\n        ]\n      },\n      {\n        \"id\": \"prepare\",\n        \"x\": 360,\n        \"y\": 300,\n        \"kind\": \"ai\",\n        \"icon\": \"ai\",\n        \"step\": 3,\n        \"min\": true,\n        \"label\": {\n          \"lv\": \"Atveram apskata pierakstu\",\n          \"en\": \"Open the review record\"\n        },\n        \"actor\": {\n          \"lv\": \"AI · saglabātie faili\",\n          \"en\": \"AI · saved records\"\n        },\n        \"paragraphs\": [\n          {\n            \"lv\": \"AI nolasa saglabāto statusu, lai vecie atvērtie punkti nepazustu un pabeigtais neatgrieztos.\",\n            \"en\": \"AI reads saved state so older open items remain and completed actions do not return.\"\n          },\n          {\n            \"lv\": \"Konkrētajam apskatam pieraksta mērķi, avotus un precizējumus. Esošie CRM un uzdevumi paliek savā autoritatīvajā vietā; apskats uz tiem atsaucas.\",\n            \"en\": \"Record the goal, sources and clarifications for this review. Existing CRM and tasks remain in their authoritative home; the review links to them.\"\n          }\n        ],\n        \"what\": {\n          \"lv\": \"Pirms jaunām ziņām AI nolasa saglabāto aktuālo statusu. Tas palīdz nepazaudēt vecos atvērtos punktus un atkārtoti neuzdot to, ko jau esi pabeidzis vai apzināti ignorējis.\",\n          \"en\": \"Before checking new messages, AI reads the saved current state. This preserves older open items and avoids repeating work already completed or deliberately ignored.\"\n        },\n        \"out\": {\n          \"lv\": \"Ir konkrētā apskata pieraksts un zināms, no kura stāvokļa turpinām.\",\n          \"en\": \"A review record and a known starting state.\"\n        },\n        \"files\": [\n          \"references/RUN-CONTRACT.md\"\n        ],\n        \"summary\": {\n          \"lv\": \"AI nolasa iepriekšējo statusu un šajā apskatā pieraksta mērķi, kontus un precizējumus.\",\n          \"en\": \"AI reads previous state and records this review’s goal, accounts and clarifications.\"\n        },\n        \"headerIcons\": [\n          \"ai\",\n          \"file\"\n        ],\n        \"companion\": \"file\",\n        \"storageRef\": \"reviews\",\n        \"stored\": {\n          \"title\": {\n            \"en\": \"Agreed private review home\",\n            \"lv\": \"Saskaņotā privātā apskata vieta\"\n          },\n          \"text\": {\n            \"en\": \"Record ID/date, purpose, coverage, decisions and links to authoritative tasks in the agreed Markdown or JSON format.\",\n            \"lv\": \"Saskaņotajā Markdown vai JSON formātā glabā ID/datumu, mērķi, pārklājumu, lēmumus un saites uz autoritatīvajiem uzdevumiem.\"\n          }\n        }\n      },\n      {\n        \"id\": \"review\",\n        \"x\": 510,\n        \"y\": 300,\n        \"kind\": \"ai\",\n        \"icon\": \"ai\",\n        \"step\": 4,\n        \"min\": true,\n        \"label\": {\n          \"lv\": \"Pārbaudām avotus\",\n          \"en\": \"Check the sources\"\n        },\n        \"actor\": {\n          \"lv\": \"AI · izvēlētie avoti\",\n          \"en\": \"AI · selected sources\"\n        },\n        \"paragraphs\": [\n          {\n            \"lv\": \"AI vai piešķirtais lasītājs iegūst norunāto kontu ziņas un pasaka, kas pārbaudīts, cik svaigi ir dati un kas palicis nepieejams.\",\n            \"en\": \"AI or the granted reader retrieves agreed account data and states coverage, freshness and gaps.\"\n          },\n          {\n            \"lv\": \"Strukturētai ievadei review_pack.py apvieno vienas darbības dublikātus un salīdzina jauno ar iepriekšējo apskatu. Nemainīgi aizvērti punkti neatgriežas; vecie atvērtie paliek.\",\n            \"en\": \"For structured input, review_pack.py merges duplicate actions and compares current evidence with the previous review. Unchanged closed items stay resolved; older open items remain.\"\n          },\n          {\n            \"lv\": \"Python izvērtē struktūru, ne sarunas nozīmi. Pirms ieteikt rīcību AI pārbauda vajadzīgo pilno kontekstu, jaunāko atbildi un termiņa pamatojumu.\",\n            \"en\": \"Python processes structure, not meaning. Before recommending action, AI checks required full context, latest replies and deadline evidence.\"\n          },\n          {\n            \"en\": \"A source monitor may supply a new-message signal. Treat it as evidence to check, not an automatic Action or obligation to reply; keep unresolved older commitments too.\",\n            \"lv\": \"Avota monitors var iedot jaunas ziņas signālu. Tas ir pārbaudāms pierādījums, ne automātisks Action vai pienākums atbildēt; paturi arī vecākās neatrisinātās saistības.\"\n          }\n        ],\n        \"what\": {\n          \"lv\": \"Vienā solī AI pārbauda visus norunātos avotus. Tavā pašreizējā lietojumā tie ir Gmail un WhatsApp. Katram kontam pasaka, ko izdevās pārbaudīt, cik svaigi ir dati un kur palika trūkums.\",\n          \"en\": \"In one step, AI checks every agreed source. Your current use centres on Gmail and WhatsApp. For each account it states coverage, freshness and any gap.\"\n        },\n        \"out\": {\n          \"lv\": \"Pārbaudīti sarunu fakti, avotu saites un godīgi nosaukts pārklājums.\",\n          \"en\": \"Checked conversation facts, source links and explicit coverage.\"\n        },\n        \"files\": [\n          \"references/RUN-CONTRACT.md\",\n          \"references/PYTHON-HELPER.md\",\n          \"references/MONITORING.md\"\n        ],\n        \"channels\": [\n          {\n            \"icon\": \"gmail\",\n            \"label\": \"Gmail\"\n          },\n          {\n            \"icon\": \"whatsapp\",\n            \"label\": \"WhatsApp\"\n          }\n        ],\n        \"summary\": {\n          \"lv\": \"Savācam norunāto kanālu datus un pārklājumu. Python tos apvieno īsā ievadē; AI pēc vajadzības nolasa pilno sarunu.\",\n          \"en\": \"Collect the agreed sources and coverage. Python builds a compact pack; AI reads full conversation context when needed.\"\n        },\n        \"headerIcons\": [\n          \"ai\"\n        ],\n        \"helper\": {\n          \"title\": {\n            \"lv\": \"Python · izmaiņu atlase un apvienošana\",\n            \"en\": \"Python · change selection and merging\"\n          },\n          \"text\": {\n            \"lv\": \"review_pack.py ir izveidots un pārbaudīts ar sintētiskiem datiem. Tas dod īsu JSON ievadi, atvērtos punktus un aprēķinātu lēmumu progresu. Kontu savienotāji paliek atsevišķi.\",\n            \"en\": \"review_pack.py is built and tested on synthetic inputs. It produces compact JSON, open items and decision progress. Account connectors remain separate.\"\n          },\n          \"file\": \"scripts/review_pack.py\"\n        }\n      },\n      {\n        \"id\": \"brief\",\n        \"x\": 810,\n        \"y\": 300,\n        \"kind\": \"ai\",\n        \"icon\": \"ai\",\n        \"step\": 5,\n        \"min\": true,\n        \"label\": {\n          \"lv\": \"Izceļam svarīgāko\",\n          \"en\": \"Show the priorities\"\n        },\n        \"actor\": {\n          \"lv\": \"AI · čats un pieraksts\",\n          \"en\": \"AI · chat and record\"\n        },\n        \"paragraphs\": [\n          {\n            \"lv\": \"AI salīdzina jauno informāciju ar iepriekšējiem lēmumiem un atšķir: man jārīkojas, gaidu no cita, jau atrisināts vai nav vajadzīga rīcība. Vecs neatrisināts solījums nepazūd tikai tāpēc, ka jaunajā atlasē nav jaunas ziņas.\",\n            \"en\": \"AI compares new information with saved decisions and separates my actions, waiting on others, resolved items and information requiring no action. An old open promise remains even without a new message.\"\n          },\n          {\n            \"lv\": \"Čatā vispirms saņem līdz pieciem svarīgākajiem nākamajiem soļiem. Pie katra ir saprotams iemesls, viens konkrēts jautājums vai rīcība, atbildīgais un vajadzīgais avots. Pārējie atvērtie punkti paliek pierakstā.\",\n            \"en\": \"Chat first shows up to five priority next actions. Each has a clear reason, one question or action, an owner and the relevant source. Other open items remain in the record.\"\n          },\n          {\n            \"lv\": \"Apskata failā saglabā kopsavilkumu, avotu ID un statusus, lai var turpināt darbu. Visu pastkastīšu un čatu tekstus bez vajadzības nekopē.\",\n            \"en\": \"The review file keeps the summary, source IDs and status decisions needed to continue. There is no need to copy entire mailboxes and chats.\"\n          }\n        ],\n        \"what\": {\n          \"lv\": \"AI salīdzina jauno informāciju ar iepriekšējiem lēmumiem un atšķir: man jārīkojas, gaidu no cita, jau atrisināts vai nav vajadzīga rīcība. Vecs neatrisināts solījums nepazūd tikai tāpēc, ka jaunajā atlasē nav jaunas ziņas.\",\n          \"en\": \"AI compares new information with saved decisions and separates my actions, waiting on others, resolved items and information requiring no action. An old open promise remains even without a new message.\"\n        },\n        \"out\": {\n          \"lv\": \"Tev ir īss rīcības saraksts; AI ir saglabāts pilnais šā apskata turpinājums.\",\n          \"en\": \"You have a short action list and AI has the review record needed to continue.\"\n        },\n        \"files\": [\n          \"references/RUN-CONTRACT.md\",\n          \"references/EXAMPLE.md\",\n          \"references/PRINCIPLES.md\"\n        ],\n        \"summary\": {\n          \"lv\": \"AI pārbauda sarunas kontekstu un izceļ līdz pieciem svarīgākajiem nākamajiem soļiem. Pamatojums paliek apskata pierakstā.\",\n          \"en\": \"AI checks conversation context and highlights up to five priority next actions. Evidence remains in the review record.\"\n        },\n        \"headerIcons\": [\n          \"ai\",\n          \"file\"\n        ],\n        \"companion\": \"file\",\n        \"storageRef\": \"reviews\",\n        \"stored\": {\n          \"title\": {\n            \"lv\": \"Pierakstā paliek pamatojums\",\n            \"en\": \"The record keeps the evidence\"\n          },\n          \"text\": {\n            \"lv\": \"Svarīgo sarunu ID, kopsavilkumi un atvērtie jautājumi. Nav jākopē visa pastkaste.\",\n            \"en\": \"Relevant conversation IDs, summaries and open questions. No need to copy the whole mailbox.\"\n          }\n        }\n      },\n      {\n        \"id\": \"act\",\n        \"x\": 1020,\n        \"y\": 300,\n        \"kind\": \"you\",\n        \"icon\": \"user\",\n        \"step\": 6,\n        \"min\": true,\n        \"label\": {\n          \"lv\": \"Izlemjam un rīkojamies\",\n          \"en\": \"Decide and act\"\n        },\n        \"actor\": {\n          \"lv\": \"Tu + AI · atkārtojams aplis\",\n          \"en\": \"You + AI · repeatable loop\"\n        },\n        \"paragraphs\": [\n          {\n            \"lv\": \"Izejat punktiem cauri sarunā. AI palīdz saprast situāciju, sagatavo atbildi vai nākamo soli. Tu vari pateikt “nosūtīju”, “izdarīts”, “gaidu atbildi”, “atlikt līdz…” vai “šo ignorējam”. Ārēja sūtīšana notiek pēc konkrētā uzdevuma atļaujas.\",\n            \"en\": \"Work through the items in chat. AI explains the situation, drafts a reply or prepares the next action. You can say “sent”, “done”, “waiting for a reply”, “defer until…” or “ignore this”. External sending follows the specific task authorisation.\"\n          },\n          {\n            \"lv\": \"Pēc katra lēmuma AI papildina apskata pierakstu un attiecīgo esošā statusa ierakstu. “Nosūtīju” atzīmē konkrēto atbildi; ja vēl jāsaņem fails vai jāizpilda solījums, tas paliek atvērts. Kopīgā statusa failā redzams, kas jādara un ko gaidām.\",\n            \"en\": \"After each decision, AI updates the review record and the relevant existing state entry. “Sent” records that reply; an outstanding delivery or promise stays open. Current state shows actions and waits.\"\n          },\n          {\n            \"lv\": \"Gmail etiķetes salāgo ar pierādīto stāvokli: Action, Waiting, Someday/Maybe vai Read/Later, izmantojot konta esošos nosaukumus. Autorizētās izmaiņas pārbauda ar atkārtotu lasījumu. Ja rakstītāja nav, redzams ieteikums un neizpildītais atlikums. Filtrus un abonementus pārskata pēc vajadzības.\",\n            \"en\": \"Align Gmail labels with evidenced state: Action, Waiting, Someday/Maybe or Read/Later, using existing account names. Verify authorised changes by reading them back. Without a writer, show the suggestion and pending change. Review filters and subscriptions when needed.\"\n          },\n          {\n            \"lv\": \"Progresa % rāda, cik šajā apskatā paceltajiem punktiem ir skaidrs lēmums un nākamais solis. To redzi čatā un apskata pierakstā. Ja nāk klāt jauns jautājums, pieaug arī kopējais punktu skaits.\",\n            \"en\": \"Progress shows the share of items raised in this review that have an explicit decision and next step. It appears in chat and the review record. A newly raised question also increases the total.\"\n          },\n          {\n            \"lv\": \"GAIDU ir izlemts punkts šim apskatam, ja zināms, no kā un ko gaidām un kad pārbaudīsim vēlreiz. ATLIKT vajag datumu vai skaidru atsākšanas nosacījumu. 100% nozīmē “viss šajā apskatā izlemts”; ārējās saistības vēl var turpināties.\",\n            \"en\": \"WAITING is decided for this review when we know who owes what and when to check again. DEFER needs a date or clear trigger. 100% means every review item has a decision; external obligations can remain open.\"\n          }\n        ],\n        \"what\": {\n          \"lv\": \"Izejat punktiem cauri sarunā. AI palīdz saprast situāciju, sagatavo atbildi vai nākamo soli. Tu vari pateikt “nosūtīju”, “izdarīts”, “gaidu atbildi”, “atlikt līdz…” vai “šo ignorējam”. Ārēja sūtīšana notiek pēc konkrētā uzdevuma atļaujas.\",\n          \"en\": \"Work through the items in chat. AI explains the situation, drafts a reply or prepares the next action. You can say “sent”, “done”, “waiting for a reply”, “defer until…” or “ignore this”. External sending follows the specific task authorisation.\"\n        },\n        \"out\": {\n          \"lv\": \"Katram izskatītajam punktam ir lēmums, saglabāts statuss un vajadzības gadījumā nākamā pārbaude.\",\n          \"en\": \"Each reviewed item has a decision, saved state and a next check where needed.\"\n        },\n        \"files\": [\n          \"references/RUN-CONTRACT.md\",\n          \"references/GMAIL-WORKFLOW.md\"\n        ],\n        \"companion\": \"ai\",\n        \"caption\": {\n          \"lv\": \"Lēmums → saglabāšana → nākamais punkts\",\n          \"en\": \"Decide → save → next item\"\n        },\n        \"progress\": {\n          \"title\": {\n            \"lv\": \"Apskata lēmumi\",\n            \"en\": \"Review decisions\"\n          },\n          \"summary\": {\n            \"lv\": \"3 no 5 piemēra punktiem izlemti; diviem vēl vajadzīga tava izvēle.\",\n            \"en\": \"3 of 5 example items are decided; two still need your choice.\"\n          },\n          \"items\": [\n            {\n              \"decided\": false,\n              \"label\": {\n                \"lv\": \"Atbildēt par komandas apmācībām\",\n                \"en\": \"Reply about team training\"\n              }\n            },\n            {\n              \"decided\": true,\n              \"label\": {\n                \"lv\": \"Atceries savu solījumu līdz 16.00\",\n                \"en\": \"Remember your promise by 16:00\"\n              }\n            },\n            {\n              \"decided\": true,\n              \"label\": {\n                \"lv\": \"Atgādināt par nosūtīto piedāvājumu\",\n                \"en\": \"Follow up on the proposal\"\n              }\n            },\n            {\n              \"decided\": false,\n              \"label\": {\n                \"lv\": \"Uzrakstīt par nākamo zv en\": \"Save and close\"\n        },\n        \"actor\": {\n          \"en\": \"AI · verified handoff\",\n          \"lv\": \"AI · pārbaudīts turpinājums\"\n        },\n        \"paragraphs\": [\n          {\n            \"lv\": \"Kad beidzat šo apskatu, čatu vai dienu, AI pasaka, kas izdarīts, kas paliek atvērts un kad pie tā atgriezties. Mērķis ir 100% skaidru lēmumu par apskatā paceltajiem punktiem.\",\n            \"en\": \"When you end the review, chat or day, AI states what is done, what remains open and when to return. The target is an explicit decision for every item raised.\"\n          },\n          {\n            \"lv\": \"Ja kāds jautājums vēl nav izlemts, to saglabā un nosauc; 100% nepaziņo. Arī nepieejamie avoti un nepārbaudītās sarunas paliek redzamas apskata robežas.\",\n            \"en\": \"If a question is undecided, preserve and name it instead of claiming 100%. Unavailable sources and unchecked conversations remain explicit review limits.\"\n          },\n          {\n            \"lv\": \"EXIT7 laikā AI saglabā pierakstu un aktuālos statusus, pārbauda, ka tos var nolasīt, un atstāj skaidru turpinājumu. Nākamais apskats sākas ar saglabāto stāvokli un pārbauda jaunās ziņas.\",\n            \"en\": \"At EXIT7, AI saves the record and current state, verifies readback and leaves a clear continuation. The next review starts from saved state and checks new messages.\"\n          }\n        ],\n        \"what\": {\n          \"lv\": \"Kad beidzat šo apskatu, čatu vai dienu, AI pasaka, kas izdarīts, kas paliek atvērts un kad pie tā atgriezties. Mērķis ir 100% skaidru lēmumu par apskatā paceltajiem punktiem.\",\n          \"en\": \"When you end the review, chat or day, AI states what is done, what remains open and when to return. The target is an explicit decision for every item raised.\"\n        },\n        \"out\": {\n          \"lv\": \"Saglabāts apskats, atvērto darbu turpinājums un skaidras nākamās pārbaudes.\",\n          \"en\": \"A saved review, . Is it still relevant? If so, we can agree on the next step.\"\n        },\n        \"decisionLabel\": {\n          \"lv\": \"Tu izvēlējies: ATBILDĒT. Melnraksts vēl nav nosūtīts.\",\n          \"en\": \"You chose REPLY. The draft has not been sent.\"\n        },\n        \"source\": {\n          \"lv\": \"DEMO-E03 · izdomāts partnera solījums\",\n          \"en\": \"DEMO-E03 · fictional partner promise\"\n        },\n        \"decided\": true\n      },\n      {\n        \"id\": \"whatsapp\",\n        \"icon\": \"whatsapp\",\n        \"channel\": \"WhatsApp\",\n        \"priority\": {\n          \"lv\": \"Jāsaskaņo\",\n          \"en\": \"To arrange\"\n        },\n        \"person\": {\n          \"lv\": \"Mārtiņš · sadarbība\",\n          \"en\": \"Mārtiņš · collaboration\"\n        },\n        \"title\": {\n          \"lv\": \"Uzrakstīt par nākamo zvanu\",\n          \"en\": \"Arrange the next call\"\n        },\n        \"contextLabel\": {\n          \"lv\": \"Ienākusī ziņa\",\n          \"en\": \"Incoming message\"\n        },\n        \"quote\": {\n          \"lv\": \"Sveiks! Vai šonedēļ varam sazvanīties uz 15 minūtēm?\",\n          \"en\": \"Hi! Could we have a 15-minute call this week?\"\n        },\n        \"why\": {\n          \"lv\": \"Ir konkrēts lūgums. AI palīdz vienoties par nākamo soli, neizdomājot brīvu kalendāra laiku.\",\n          \"en\": \"There is a specific request. AI helps agree on a next step without inventing calendar availability.\"\n        },\n        \"action\": {\n          \"lv\": \"Palūgt divus iespējamos laikus un zvana tēmu.\",\n          \"en\": \"Ask for two possible times and the call topic.\"\n        },\n        \"draft\": {\n          \"lv\": \"Sveiks! Varu palīdzēt. Atsūti, lūdzu, divus tev ērtus laikus un tēmu, ko gribi pārrunāt.\",\n          \"en\": \"Hi! Happy to help. Please send two times that work for you and the topic you want to discuss.\"\n        },\n        \"decisionLabel\": {\n          \"lv\": \"Vēl vajadzīga tava izvēle; WhatsApp ziņa nav nosūtīta.\",\n          \"en\": \"Your choice is still needed; no WhatsApp message has been sent.\"\n        },\n        \"source\": {\n          \"lv\": \"DEMO-W01 · izdomāta WhatsApp saruna\",\n          \"en\": \"DEMO-W01 · fictional WhatsApp conversation\"\n        },\n        \"decided\": false\n      },\n      {\n        \"id\": \"waiting\",\n        \"icon\": \"file\",\n        \"channel\": {\n          \"lv\": \"Saglabātais statuss\",\n          \"en\": \"Saved state\"\n        },\n        \"priority\": \"WAITING\",\n        \"waiting\": true,\n        \"person\": {\n          \"lv\": \"Materiālu saņemšana\",\n          \"en\": \"Receiving materials\"\n        },\n        \"title\": {\n          \"lv\": \"Gaidu failu no partnera\",\n          \"en\": \"Waiting for the partner’s file\"\n        },\n        \"contextLabel\": {\n          \"lv\": \"Iepriekš atvērtais punkts\",\n          \"en\": \"Previously open item\"\n        },\n        \"quote\": {\n          \"lv\": \"Failu nosūtīšu līdz 22. oktobrim.\",\n          \"en\": \"I will send the file by 22 October.\"\n        },\n        \"why\": {\n          \"lv\": \"Jaunas ziņas šajā aplī nav, taču atvērtais solījums saglabājas.\",\n          \"en\": \"No new message in this pass, but the open promise remains.\"\n        },\n        \"action\": {\n          \"lv\": \"Turpināt gaidīt; pārbaudīt 23. oktobrī.\",\n          \"en\": \"Keep waiting; check on 23 October.\"\n        },\n        \"followup\": {\n          \"lv\": \"No kā: partneris.\\nKo gaidu: saskaņoto materiālu failu.\\nNākamā pārbaude: 23.10.2026.\\n\\nPapildu atgādinājums šobrīd nav izvēlēts.\",\n          \"en\": \"Who: the partner.\\nExpected: the agreed materials file.\\nNext check: 23 Oct 2026.\\n\\nNo additional reminder has been selected now.\"\n        },\n        \"decisionLabel\": {\n          \"lv\": \"Tu izvēlējies: GAIDU. Lēmums skaidrs; saistība atvērta.\",\n          \"en\": \"You chose WAITING. The decision is clear; the obligation remains open.\"\n        },\n        \"source\": {\n          \"lv\": \"DEMO-S01 · izdomāts saglabāts punkts\",\n          \"en\": \"DEMO-S01 · fictional saved item\"\n        },\n        \"decided\": true\n      }\n    ],\n    \"note\": {\n      \"lv\": \"Visas situācijas ir izdomātas. Kopēšanas poga tikai iekopē tekstu starpliktuvē. Lēmumu progresu šim piemēram aprēķināja īstais review_pack.py ar sintētisku ievadi.\",\n      \"en\": \"All scenarios are fictional. Copy buttons only copy text to the clipboard. The actual review_pack.py calculated this example’s decision progress from synthetic inputs.\"\n    },\n    \"sourceDoc\": \"references/EXAMPLE.md\",\n    \"sourceLabel\": {\n      \"lv\": \"Piemēra situācijas un skaitļu pamats\",\n      \"en\": \"Example scenarios and number basis\"\n    },\n    \"layouts\": {\n      \"default\": \"desk\",\n      \"labels\": {\n        \"desk\": {\n          \"lv\": \"EXAMPLE 1 · Saraksts\",\n          \"en\": \"EXAMPLE 1 · List\"\n        },\n        \"cards\": {\n          \"lv\": \"EXAMPLE 2 · Kartītes\",\n          \"en\": \"EXAMPLE 2 · Cards\"\n        }\n      },\n      \"note\": {\n        \"lv\": \"Tie paši pieci punkti. Atver tikai vajadzīgo.\",\n        \"en\": \"The same five items. Open only what you need.\"\n      }\n    }\n  },\n  \"guides\": {\n    \"principles\": {\n      \"eyebrow\": \"COMMS7 · SKILL.md\",\n      \"title\": {\n        \"lv\": \"Pēc kā COMMS7 pieņem lēmumu\",\n        \"en\": \"How COMMS7 chooses the next action\"\n      },\n      \"lead\": {\n        \"lv\": \"COMMS7 meklē neatrisinātu saistību un tās nākamo soli. Nelasīta ziņa pati par sevi nav darbs, bet paša solījums paliek svarīgs arī pēc atbildes nosūtīšanas.\",\n        \"en\": \"COMMS7 looks for unresolved commitments and their next step. An unread message is not itself a task; your promise can remain open after sending a reply.\"\n      },\n      \"sections\": [\n        {\n          \"title\": {\n            \"lv\": \"Kas ir galvenajā SKILL.md\",\n            \"en\": \"What the main SKILL.md contains\"\n          },\n          \"text\": {\n            \"lv\": \"AI sāk ar šo failu: mērķis, izsaukuma režīms, atlases noteikumi, konteksta avoti un robežas. Detalizētais apļa līgums un izvēles režīmi ir piesaistītajos failos, kurus ielādē pēc vajadzības.\",\n            \"en\": \"AI starts with this file: purpose, invocation mode, selection rules, context sources and limits. The detailed run contract and optional modes live in linked files loaded when relevant.\"\n          },\n          \"docs\": [\n            {\n              \"file\": \"SKILL.md\",\n              \"label\": {\n                \"lv\": \"Atvērt galveno instrukciju\",\n                \"en\": \"Open the main instructions\"\n              }\n            },\n            {\n              \"file\": \"references/RUN-CONTRACT.md\",\n              \"label\": {\n                \"lv\": \"Pilnais izpildes līgums\",\n                \"en\": \"Full run contract\"\n              }\n            }\n          ]\n        },\n        {\n          \"title\": {\n            \"lv\": \"Pieci pārbaudes jautājumi\",\n            \"en\": \"Five decision checks\"\n          },\n          \"rows\": [\n            {\n              \"label\": {\n                \"lv\": \"1. Kam tas adresēts?\",\n                \"en\": \"1. Who is addressed?\"\n              },\n              \"text\": {\n                \"lv\": \"Vai lūgums tiešām ir tev vai cilvēkam, kura darbību tu koordinē? Grupas pieminējums pats nerada darbu.\",\n                \"en\": \"Is the request directed at you or someone whose work you coordinate? A group mention alone creates no task.\"\n              }\n            },\n            {\n              \"label\": {\n                \"lv\": \"2. Kas ir atvērts?\",\n                \"en\": \"2. What is unresolved?\"\n              },\n              \"text\": {\n                \"lv\": \"Konkrēts jautājums, paša solījums, saņemams rezultāts vai termiņš; nosaki vienu pārbaudāmu nākamo soli.\",\n                \"en\": \"Identify the actual question, your promise, expected result or deadline, then one verifiable next step.\"\n              }\n            },\n            {\n              \"label\": {\n                \"lv\": \"3. Vai tas jau atrisināts?\",\n                \"en\": \"3. Is it already resolved?\"\n              },\n              \"text\": {\n                \"lv\": \"Pārbaudi jaunāko sarunu, nosūtīto, citu atļauto kanālu un tavu iepriekšējo lēmumu.\",\n                \"en\": \"Check the latest thread, sent messages, other authorised channels and your previous decision.\"\n              }\n            },\n            {\n              \"label\": {\n                \"lv\": \"4. Kāpēc tagad?\",\n                \"en\": \"4. Why now?\"\n              },\n              \"text\": {\n                \"lv\": \"Ņem vērā īsto termiņu, sekas, cilvēka kontekstu un pieņemtās FOCUS7 prioritātes. Neizdomā steidzamību.\",\n                \"en\": \"Use actual deadlines, consequences, person context and accepted FOCUS7 priorities. Do not invent urgency.\"\n              }\n            },\n            {\n              \"label\": {\n                \"lv\": \"5. Ko var secināt?\",\n                \"en\": \"5. What does evidence support?\"\n              },\n              \"text\": {\n                \"lv\": \"Iesaki atbildēt, darīt, piezvanīt, gaidīt, atlikt vai izlaist. Ja vajadzīgais konteksts nav pieejams, nosauc trūkumu.\",\n                \"en\": \"Recommend replying, doing, calling, waiting, deferring or skipping. If required context is missing, state the gap.\"\n              }\n            }\n          ],\n          \"docs\": []\n        },\n        {\n          \"title\": {\n            \"lv\": \"Kā izvēle parādās Gmail\",\n            \"en\": \"How decisions appear in Gmail\"\n          },\n          \"rows\": [\n            {\n              \"label\": \"Action / Waiting\",\n              \"text\": {\n                \"lv\": \"Man jārīkojas vai gaidu citu. Nosūtīta atbilde var atstāt solītu piegādi atvērtu; abas etiķetes vienā pavedienā var būt pamatotas.\",\n                \"en\": \"I need to act or am waiting on someone else. A sent reply can leave a promised delivery open; both labels can be justified on one thread.\"\n              }\n            },\n            {\n              \"label\": \"Someday/Maybe / Read/Later\",\n              \"text\": {\n                \"lv\": \"Vēl neuzņemta iecere vai izvēlēta lasīšana. Atlikts reāls solījums saglabā savu darbību un atsākšanas datumu.\",\n                \"en\": \"An optional future idea or selected reading. A deferred commitment keeps its action and restart date.\"\n              }\n            },\n            {\n              \"label\": {\n                \"lv\": \"Filtri un abonementi\",\n                \"en\": \"Filters and subscriptions\"\n              },\n              \"text\": {\n                \"lv\": \"Piedāvā atkārtojamu šķirošanu vai atteikšanos ar pamatojumu. Konkrēto izmaiņu izpilda tikai pēc pieņemšanas un ar pieejamu rīku.\",\n                \"en\": \"Proposes repeatable sorting or unsubscribe with a reason. Executes the concrete change only after acceptance and with an available tool.\"\n              }\n            }\n          ],\n          \"note\": {\n            \"lv\": \"Izmanto esošos konta label nosaukumus. “Ieteikts” un “Gmail izdarīts un pārbaudīts” ir dažādi rezultāti.\",\n            \"en\": \"Uses existing account label names. “Suggested” and “applied and verified in Gmail” are different results.\"\n          },\n          \"docs\": [\n            {\n              \"file\": \"references/GMAIL-WORKFLOW.md\",\n              \"label\": {\n                \"lv\": \"Etiķešu un filtru līgums\",\n                \"en\": \"Label and filter contract\"\n              }\n            }\n          ]\n        },\n        {\n          \"title\": {\n            \"lv\": \"Kā tas atšķiras praksē\",\n            \"en\": \"What this changes in practice\"\n          },\n          \"items\": [\n            {\n              \"title\": {\n                \"lv\": \"“Paldies!”\",\n                \"en\": \"“Thanks!”\"\n              },\n              \"text\": {\n                \"lv\": \"Ja jauna jautājuma vai saistības nav, atbildi neprasa un darbu neveido.\",\n                \"en\": \"With no new question or commitment, no reply or task is needed.\"\n              }\n            },\n            {\n              \"title\": {\n                \"lv\": \"“Prezentāciju nosūtīšu rīt”\",\n                \"en\": \"“I will send the slides tomorrow”\"\n              },\n              \"text\": {\n                \"lv\": \"Atbilde var būt nosūtīta, bet prezentācijas piegāde vēl ir atvērta.\",\n                \"en\": \"The reply may be sent while the promised delivery remains open.\"\n              }\n            },\n            {\n              \"title\": {\n                \"lv\": \"“Atbildēšu piektdien”\",\n                \"en\": \"“I will reply on Friday”\"\n              },\n              \"text\": {\n                \"lv\": \"Gaidām otras puses atbildi līdz norunātajam datumam; neatgādinām patvaļīgi ātrāk.\",\n                \"en\": \"Wait for the other party until the agreed date; do not invent an earlier reminder.\"\n              }\n            },\n            {\n              \"title\": {\n                \"lv\": \"Reklāma vai jaunumi\",\n                \"en\": \"Promotion or newsletter\"\n              },\n              \"text\": {\n                \"lv\": \"Parasti neprasa atbildi. Lasīšanai noderīgais var nonākt NEWS7 izvērtēšanā, ja tas ir tavs uzdevums.\",\n                \"en\": \"Usually requires no reply. Relevant reading can be considered through NEWS7 when that is your task.\"\n              }\n            }\n          ],\n          \"note\": {\n            \"lv\": \"AI ieteikums nav pieņemts uzdevums. Tu izvēlies; GATAVS aizver tikai nosaukto soli.\",\n            \"en\": \"An AI suggestion is not an accepted task. You decide; DONE closes only the named action.\"\n          },\n          \"docs\": []\n        },\n        {\n          \"title\": {\n            \"lv\": \"Kādus rīkus izvēlas\",\n            \"en\": \"How tools are selected\"\n          },\n          \"rows\": [\n            {\n              \"label\": \"Gmail / WhatsApp\",\n              \"text\": {\n                \"lv\": \"Saņemtā un nosūtītā konteksts no atļautā konta; Gmail izvilkums vai WA kolektora metadati vieni nav pilns apskats.\",\n                \"en\": \"Read received and sent context for the authorised account; a Gmail snippet or WhatsApp metadata alone is not a full review.\"\n              }\n            },\n            {\n              \"label\": \"CRM7\",\n              \"text\": {\n                \"lv\": \"Atrodi pareizo cilvēku un nolasi vajadzīgo pēdējās sarunas kontekstu, ja piešķirtais rīks ir pieejams.\",\n                \"en\": \"Match the person and read relevant recent context where the granted tool is available.\"\n              }\n            },\n            {\n              \"label\": {\n                \"lv\": \"Kalendārs un dokumenti\",\n                \"en\": \"Calendar and documents\"\n              },\n              \"text\": {\n                \"lv\": \"Izmanto, ja tie vajadzīgi konkrēta termiņa, pieejamības vai piegādes pārbaudei.\",\n                \"en\": \"Use when needed to verify a particular deadline, availability or delivery.\"\n              }\n            },\n            {\n              \"label\": {\n                \"lv\": \"Citi kanāli\",\n                \"en\": \"Other channels\"\n              },\n              \"text\": {\n                \"lv\": \"LinkedIn, Circle un citus avotus pievieno ar nosauktu kontu, tiesībām un pārbaudītu pārklājumu.\",\n                \"en\": \"Additional sources need a named account, permissions and verified coverage.\"\n              }\n            }\n          ],\n          \"docs\": [\n            {\n              \"file\": \"references/PRINCIPLES.md\",\n              \"label\": {\n                \"lv\": \"Atlases principu pilnais teksts\",\n                \"en\": \"Full selection principles\"\n              }\n            }\n          ]\n        },\n        {\n          \"id\": \"guide-monitoring\",\n          \"title\": {\n            \"en\": \"A source signal is not a reply decision\",\n            \"lv\": \"Avota signāls vēl nav lēmums atbildēt\"\n          },\n          \"text\": {\n            \"en\": \"An authorised activity monitor can detect changed incoming evidence. The COMMS7 review still checks the full conversation and prior decisions before deciding what you owe.\",\n            \"lv\": \"Autorizēts avota monitors var pamanīt mainītu ienākošo saturu. COMMS7 apskats joprojām pārbauda pilno sarunu un iepriekšējos lēmumus, pirms nosaka, kas tev jādara.\"\n          },\n          \"rows\": [\n            {\n              \"label\": {\n                \"en\": \"Source activity\",\n                \"lv\": \"Avota aktivitāte\"\n              },\n              \"text\": {\n                \"en\": \"An agreed reader, cadence and private destination; unchanged cycles remain quiet and old history is a baseline.\",\n                \"lv\": \"Saskaņots lasītājs, ritms un privāts saņēmējs; nemainīgs cikls klusē, vecā vēsture ir sākuma stāvoklis.\"\n              }\n            },\n            {\n              \"label\": {\n                \"en\": \"Semantic review\",\n                \"lv\": \"Semantiskais apskats\"\n              },\n              \"text\": {\n                \"en\": \"A new “thanks” may need no action. An old promise can remain open without a new message. Read latest sent/draft context before proposing a reply.\",\n                \"lv\": \"Jauns “paldies” var neprasīt rīcību. Vecs solījums paliek atvērts arī bez jaunas ziņas. Pirms atbildes ieteikuma pārbaudi jaunāko nosūtīto un melnrakstus.\"\n              }\n            }\n          ],\n          \"note\": {\n            \"en\": \"This package includes no connected account, owner schedule or notification service. Verify each actual reader, runner and delivery separately.\",\n            \"lv\": \"Šajā pakotnē nav pieslēgta konta, īpašnieka grafika vai paziņojumu servisa. Atsevišķi pārbaudi īsto lasītāju, palaidēju un piegādi.\"\n          },\n          \"docs\": [\n            {\n              \"file\": \"references/MONITORING.md\",\n              \"label\": {\n                \"en\": \"Optional monitoring contract\",\n                \"lv\": \"Izvēles monitora līgums\"\n              }\n            }\n          ]\n        },\n        {\n          \"id\": \"guide-aios\",\n          \"title\": {\n            \"lv\": \"COMMS7 kopējā AIOS sistēmā\",\n            \"en\": \"COMMS7 in the AIOS system\"\n          },\n          \"text\": {\n            \"lv\": \"Saistība ar AIOS: augsta. COMMS7 apvieno biznesa virzienu, aktuālo darbu un attiecību vēsturi, lai izvēlētos tev nozīmīgu nākamo soli.\",\n            \"en\": \"AIOS integration: high. COMMS7 combines business direction, current work and relationship history to choose a next step that matters to you.\"\n          },\n          \"rows\": [\n            {\n              \"label\": \"01 · Constitution\",\n              \"text\": {\n                \"lv\": \"North Star dod ilgtermiņa virzienu: kuras iespējas atbilst pieņemtajiem mērķiem? Tas palīdz noteikt vērtību līdzās īstiem termiņiem un saistībām.\",\n                \"en\": \"North Star supplies direction: which opportunities support accepted goals? It adds strategic relevance alongside actual deadlines and commitments.\"\n              }\n            },\n            {\n              \"label\": \"02 · Memory\",\n              \"text\": {\n                \"lv\": \"Projektu fakti un iepriekšējās vienošanās precizē atbildi. Pieņemtie ilglaicīgie secinājumi nonāk pareizajā projekta/CRM avotā; privātie apskati paliek īpašnieka datu mapē.\",\n                \"en\": \"Project facts and prior agreements make the reply specific. Accepted lasting outcomes go to the right project/CRM source; private reviews remain in owner storage.\"\n              }\n            },\n            {\n              \"label\": \"03 · Skills\",\n              \"text\": {\n                \"lv\": \"CRM7 dod cilvēka kontekstu; FOCUS7 apstrādā pieņemtas prioritāšu izmaiņas; NEWS7 var izvērtēt prasītu lasāmvielu. Piešķirtie aģenti palīdz savās lomās.\",\n                \"en\": \"CRM7 supplies person context; FOCUS7 handles accepted priority changes; NEWS7 can assess requested reading. Granted agents contribute within their roles.\"\n              }\n            },\n            {\n              \"label\": \"04 · Tools\",\n              \"text\": {\n                \"lv\": \"Izmanto kopīgos, piešķirtos kontu savienojumus un rīkus. Pārbauda to pieejamību un svaigumu; katrai prasmei nav jābūvē atsevišķs pieslēgums.\",\n                \"en\": \"Uses shared, granted account connections and tools. Checks availability and freshness; every skill need not build a separate connection.\"\n              }\n            },\n            {\n              \"label\": \"05 · Focus\",\n              \"text\": {\n                \"lv\": \"Aktīvie projekti, uzdevumi un pieņemtās pauzes nosaka, kas svarīgs tagad. Ziņa par aktuālu piegādi saņem projekta kontekstu; jauna ideja automātiski nekļūst par prioritāti.\",\n                \"en\": \"Active projects, tasks and accepted pauses determine what matters now. A current delivery message gains project context; a new idea does not automatically become a priority.\"\n              }\n            }\n          ],\n          \"note\": {\n            \"lv\": \"“Augsta” ir kvalitatīvs saistības vērtējums, ne izmērīta precizitāte. Piemērs: aktīvas piegādes turpinājumu salīdzina ar jauna projekta piedāvājumu, ņemot vērā North Star, Focus un vienošanos vēsturi. Dotu solījumu neatceļ arī tad, ja tas ir ārpus Focus.\",\n            \"en\": \"“High” is a qualitative integration assessment, not measured accuracy. Example: compare a current delivery follow-up with a new project offer using North Star, Focus and prior agreements. Commitments outside Focus still count.\"\n          },\n          \"docs\": [\n            {\n              \"file\": \"references/AIOS-INTEGRATION.md\",\n              \"label\": {\n                \"lv\": \"Pilnā AIOS saikne\",\n                \"en\": \"Full AIOS integration\"\n              }\n            },\n            {\n              \"file\": \"references/STORAGE-PLAN.md\",\n              \"label\": {\n                \"lv\": \"Failu izvietojuma priekšlikums\",\n                \"en\": \"Storage proposal\"\n              }\n            }\n          ],\n          \"items\": [\n            {\n              \"title\": {\n                \"lv\": \"Lietojot atsevišķi\",\n                \"en\": \"Used on its own\"\n              },\n              \"text\": {\n                \"lv\": \"Var atlasīt jautājumus, solījumus un termiņus no dotajām sarunām. Mērķis, vēsture un prioritātes jāiedod pašam.\",\n                \"en\": \"Can identify questions, promises and deadlines in supplied conversations. You provide the goals, history and priorities.\"\n              }\n            },\n            {\n              \"title\": {\n                \"lv\": \"Kopā ar AIOS\",\n                \"en\": \"Within AIOS\"\n              },\n              \"text\": {\n                \"lv\": \"Izmanto jau pieņemto virzienu un aktuālo kontekstu, atceras lēmumus un saglabā turpinājumu pareizajā vietā. Mazāk atkārtotas skaidrošanas.\",\n                \"en\": \"Uses accepted direction and current context, remembers decisions and preserves the handoff in the right place. Less repeated explanation.\"\n              }\n            }\n          ]\n        }\n      ]\n    }\n  }\n}\n","encoding":"utf-8","zip":true}},"zip":{"root":"comms7","order":["LICENSE.txt","REVIEW-MODES.md","SKILL.md","SOURCE.json","manifest.json","references/AIOS-INTEGRATION.md","references/EXAMPLE.md","references/GMAIL-WORKFLOW.md","references/MONITORING.md","references/PRINCIPLES.md","references/PYTHON-HELPER.md","references/READINESS.md","references/README.md","references/RUN-CONTRACT.md","references/SCORECARD.md","references/SOCIAL-MODE.md","references/STORAGE-PLAN.md","scripts/README.md","scripts/review_pack.py","scripts/test_review_pack.py","view.json"],"count":21,"bytes":146097,"kb":143},"advanced":null,"flow":{"presentation":"journey","revision":"2026-10-22-foundation","width":1400,"height":675,"left":0,"top":0,"start":"invoke","sequence":["invoke","scope","prepare","review","brief","act","close"],"eyebrow":{"lv":"COMMS7 · darba plūsma","en":"COMMS7 · workflow"},"title":{"lv":"Pārbaudām, izlemjam un saglabājam","en":"Review, decide and save"},"lead":{"lv":"Detalizētā shēma rāda avotus, Python, failus un kontekstu. Īsā shēma parāda galveno darba apli.","en":"The detailed diagram includes sources, Python, files and context. The short diagram shows the main work loop."},"notes":[{"x":20,"w":450,"label":{"lv":"Mērķis un iepriekšējais statuss","en":"Goal and saved state"}},{"x":480,"w":510,"label":{"lv":"Avoti · Python · AI","en":"Sources · Python · AI"}},{"x":1000,"w":380,"label":{"lv":"Lēmumi un turpinājums","en":"Decisions and continuation"}}],"goal":{"x":50,"y":83,"w":240,"h":155,"label":{"lv":"Mērķis","en":"Goal"},"text":{"lv":"Kam jāatbild, kas jāizdara un ko gaidu. Katram punktam skaidrs nākamais solis.","en":"Who needs a reply, what needs doing and what I am waiting for. Every item has a clear next step."}},"nodes":[{"id":"invoke","x":60,"y":300,"kind":"you","icon":"user","step":1,"min":true,"label":{"lv":"Tu izsauc COMMS7","en":"You ask for COMMS7"},"actor":{"lv":"Tu · čatā","en":"You · in chat"},"paragraphs":[{"lv":"Čatā ieraksti COMMS7. AI ielādē prasmi un tās darba kārtību. Vari uzreiz lījumus. Papildu jautājumu uzdod tad, ja atbilde mainītu to, ko pārbaudīt.","en":"If you type only “COMMS7”, AI proposes a useful starting point, such as important unanswered requests and open promises. It asks a follow-up when the answer changes what should be reviewed."},{"lv":"FOCUS7 pašreizējās prioritātes palīdz noteikt svarīgumu. CRM7 dod atrastā cilvēka pēdējo profesionālo kontekstu, ja pieejams piešķirts lasītājs. Tas pats nepiešķir jaunu CRM rakstīšanu.","en":"Current FOCUS7 priorities inform importance. CRM7 provides the matched person’s latest professional context where a granted reader is available. Reading does not grant CRM writes."}],"what":{"lv":"AI izmanto jau pateikto, iepriekšējos lēmumus un Business darba kontekstu. Vienojas par mērķi, kanāliem, kontiem un apskata dziļumu; jau atbildēto nejautā vēlreiz.","en":"AI uses your request, previous decisions and Business context. Agree on the goal, channels, accounts and review depth; do not ask again for information already supplied."},"out":{"lv":"Skaidrs, ko šajā apskatā pārbaudām un kādu rezultātu gaidām.","en":"A clear review scope and expected result."},"files":["SKILL.md","references/RUN-CONTRACT.md","references/PRINCIPLES.md","references/AIOS-INTEGRATION.md"],"summary":{"lv":"AI izmanto jau pateikto un precizē tikai to, kas tiešām maina apskatu.","en":"AI uses what you already said and asks only for details that change the review."},"headerIcons":["ai"]},{"id":"prepare","x":360,"y":300,"kind":"ai","icon":"ai","step":3,"min":true,"label":{"lv":"Atveram apskata pierakstu","en":"Open the review record"},"actor":{"lv":"AI · saglabātie faili","en":"AI · saved records"},"paragraphs":[{"lv":"AI nolasa saglabāto statusu, lai vecie atvērtie punkti nepazustu un pabeigtais neatgrieztos.","en":"AI reads saved state so older open items remain and completed actions do not return."},{"lv":"Konkrētajam apskatam pieraksta mērķi, avotus un precizējumus. Esošie CRM un uzdevumi paliek savā autoritatīvajā vietā; apskats uz tiem atsaucas.","en":"Record the goal, sources and clarifications for this review. Existing CRM and tasks remain in their authoritative home; the review links to them."}],"what":{"lv":"Pirms jaunām ziņām AI nolasa saglabāto aktuālo statusu. Tas palīdz nepazaudēt vecos atvērtos punktus un atkārtoti neuzdot to, ko jau esi pabeidzis vai apzināti ignorējis.","en":"Before checking new messages, AI reads the saved current state. This preserves older open items and avoids repeating work already completed or deliberately ignored."},"out":{"lv":"Ir konkrētā apskata pieraksts un zināms, no kura stāvokļa turpinām.","en":"A review record and a known starting state."},"files":["references/RUN-CONTRACT.md"],"summary":{"lv":"AI nolasa iepriekšējo statusu un šajā apskatā pieraksta mērķi, kontus un precizējumus.","en":"AI reads previous state and records this review’s goal, accounts and clarifications."},"headerIcons":["ai","file"],"companion":"file","storageRef":"reviews","stored":{"title":{"en":"Agreed private review home","lv":"Saskaņotā privātā apskata vieta"},"text":{"en":"Record ID/date, purpose, coverage, decisions and links to authoritative tasks in the agreed Markdown or JSON format.","lv":"Saskaņotajā Markdown vai JSON formātā glabā ID/datumu, mērķi, pārklājumu, lēmumus un saites uz autoritatīvajiem uzdevumiem."}}},{"id":"review","x":510,"y":300,"kind":"ai","icon":"ai","step":4,"min":true,"label":{"lv":"Pārbaudām avotus","en":"Check the sources"},"actor":{"lv":"AI · izvēlētie avoti","en":"AI · selected sources"},"paragraphs":[{"lv":"AI vai piešķirtais lasītājs iegūst norunāto kontu ziņas un pasaka, kas pārbaudīts, cik svaigi ir dati un kas palicis nepieejams.","en":"AI or the granted reader retrieves agreed account data and states coverage, freshness and gaps."},{"lv":"Strukturētai ievadei review_pack.py apvieno vienas darbības dublikātus un salīdzina jauno ar iepriekšējo apskatu. Nemainīgi aizvērti punkti neatgriežas; vecie atvērtie paliek.","en":"For structured input, review_pack.py merges duplicate actions and compares current evidence with the previous review. Unchanged closed items stay resolved; older open items remain."},{"lv":"Python izvērtē struktūru, ne sarunas nozīmi. Pirms ieteikt rīcību AI pārbauda vajadzīgo pilno kontekstu, jaunāko atbildi un termiņa pamatojumu.","en":"Python processes structure, not meaning. Before recommending action, AI checks required full context, latest replies and deadline evidence."},{"en":"A source monitor may supply a new-message signal. Treat it as evidence to check, not an automatic Action or obligation to reply; keep unresolved older commitments too.","lv":"Avota monitors var iedot jaunas ziņas signālu. Tas ir pārbaudāms pierādījums, ne automātisks Action vai pienākums atbildēt; paturi arī vecākās neatrisinātās saistības."}],"what":{"lv":"Vienā solī AI pārbauda visus norunātos avotus. Tavā pašreizējā lietojumā tie ir Gmail un WhatsApp. Katram kontam pasaka, ko izdevās pārbaudīt, cik svaigi ir dati un kur palika trūkums.","en":"In one step, AI checks every agreed source. Your current use centres on Gmail and WhatsApp. For each account it states coverage, freshness and any gap."},"out":{"lv":"Pārbaudīti sarunu fakti, avotu saites un godīgi nosaukts pārklājums.","en":"Checked conversation facts, source links and explicit coverage."},"files":["references/RUN-CONTRACT.md","references/PYTHON-HELPER.md","references/MONITORING.md"],"channels":[{"icon":"gmail","label":"Gmail"},{"icon":"whatsapp","label":"WhatsApp"}],"summary":{"lv":"Savācam norunāto kanālu datus un pārklājumu. Python tos apvieno īsā ievadē; AI pēc vajadzības nolasa pilno sarunu.","en":"Collect the agreed sources and coverage. Python builds a compact pack; AI reads full conversation context when needed."},"headerIcons":["ai"],"helper":{"title":{"lv":"Python · izmaiņu atlase un apvienošana","en":"Python · change selection and merging"},"text":{"lv":"review_pack.py ir izveidots un pārbaudīts ar sintētiskiem datiem. Tas dod īsu JSON ievadi, atvērtos punktus un aprēķinātu lēmumu progresu. Kontu savienotāji paliek atsevišķi.","en":"review_pack.py is built and tested on synthetic inputs. It produces compact JSON, open items and decision progress. Account connectors remain separate."},"file":"scripts/review_pack.py"}},{"id":"brief","x":810,"y":300,"kind":"ai","icon":"ai","step":5,"min":true,"label":{"lv":"Izceļam svarīgāko","en":"Show the priorities"},"actor":{"lv":"AI · čats un pieraksts","en":"AI · chat and record"},"paragraphs":[{"lv":"AI salīdzina jauno informāciju ar iepriekšējiem lēmumiem un atšķir: man jārīkojas, gaidu no cita, jau atrisināts vai nav vajadzīga rīcība. Vecs neatrisināts solījums nepazūd tikai tāpēc, ka jaunajā atlasē nav jaunas ziņas.","en":"AI compares new information with saved decisions and separates my actions, waiting on others, resolved items and information requiring no action. An old open promise remains even without a new message."},{"lv":"Čatā vispirms saņem līdz pieciem svarīgākajiem nākamajiem soļiem. Pie katra ir saprotams iemesls, viens konkrēts jautājums vai rīcība, atbildīgais un vajadzīgais avots. Pārējie atvērtie punkti paliek pierakstā.","en":"Chat first shows up to five priority next actions. Each has a clear reason, one question or action, an owner and the relevant source. Other open items remain in the record."},{"lv":"Apskata failā saglabā kopsavilkumu, avotu ID un statusus, lai var turpināt darbu. Visu pastkastīšu un čatu tekstus bez vajadzības nekopē.","en":"The review file keeps the summary, source IDs and status decisions needed to continue. There is no need to copy entire mailboxes and chats."}],"what":{"lv":"AI salīdzina jauno informāciju ar iepriekšējiem lēmumiem un atšķir: man jārīkojas, gaidu no cita, jau atrisināts vai nav vajadzīga rīcība. Vecs neatrisināts solījums nepazūd tikai tāpēc, ka jaunajā atlasē nav jaunas ziņas.","en":"AI compares new information with saved decisions and separates my actions, waiting on others, resolved items and information requiring no action. An old open promise remains even without a new message."},"out":{"lv":"Tev ir īss rīcības saraksts; AI ir saglabāts pilnais šā apskata turpinājums.","en":"You have a short action list and AI has the review record needed to continue."},"files":["references/RUN-CONTRACT.md","references/EXAMPLE.md","references/PRINCIPLES.md"],"summary":{"lv":"AI pārbauda sarunas kontekstu un izceļ līdz pieciem svarīgākajiem nākamajiem soļiem. Pamatojums paliek apskata pierakstā.","en":"AI checks conversation context and highlights up to five priority next actions. Evidence remains in the review record."},"headerIcons":["ai","file"],"companion":"file","storageRef":"reviews","stored":{"title":{"lv":"Pierakstā paliek pamatojums","en":"The record keeps the evidence"},"text":{"lv":"Svarīgo sarunu ID, kopsavilkumi un atvērtie jautājumi. Nav jākopē visa pastkaste.","en":"Relevant conversation IDs, summaries and open questions. No need to copy the whole mailbox."}}},{"id":"act","x":1020,"y":300,"kind":"you","icon":"user","step":6,"min":true,"label":{"lv":"Izlemjam un rīkojamies","en":"Decide and act"},"actor":{"lv":"Tu + AI · atkārtojams aplis","en":"You + AI · repeatable loop"},"paragraphs":[{"lv":"Izejat punktiem cauri sarunā. AI palīdz saprast situāciju, sagatavo atbildi vai nākamo soli. Tu vari pateikt “nosūtīju”, “izdarīts”, “gaidu atbildi”, “atlikt līdz…” vai “šo ignorējam”. Ārēja sūtīšana notiek pēc konkrētā uzdevuma atļaujas.","en":"Work through the items in chat. AI explains the situation, drafts a reply or prepares the next action. You can say “sent”, “done”, “waiting for a reply”, “defer until…” or “ignore this”. External sending follows the specific task authorisation."},{"lv":"Pēc katra lēmuma AI papildina apskata pierakstu un attiecīgo esošā statusa ierakstu. “Nosūtīju” atzīmē konkrēto atbildi; ja vēl jāsaņem fails vai jāizpilda solījums, tas paliek atvērts. Kopīgā statusa failā redzams, kas jādara un ko gaidām.","en":"After each decision, AI updates the review record and the relevant existing state entry. “Sent” records that reply; an outstanding delivery or promise stays open. Current state shows actions and waits."},{"lv":"Gmail etiķetes salāgo ar pierādīto stāvokli: Action, Waiting, Someday/Maybe vai Read/Later, izmantojot konta esošos nosaukumus. Autorizētās izmaiņas pārbauda ar atkārtotu lasījumu. Ja rakstītāja nav, redzams ieteikums un neizpildītais atlikums. Filtrus un abonementus pārskata pēc vajadzības.","en":"Align Gmail labels with evidenced state: Action, Waiting, Someday/Maybe or Read/Later, using existing account names. Verify authorised changes by reading them back. Without a writer, show the suggestion and pending change. Review filters and subscriptions when needed."},{"lv":"Progresa % rāda, cik šajā apskatā paceltajiem punktiem ir skaidrs lēmums un nākamais solis. To redzi čatā un apskata pierakstā. Ja nāk klāt jauns jautājums, pieaug arī kopējais punktu skaits.","en":"Progress shows the share of items raised in this review that have an explicit decision and next step. It appears in chat and the review record. A newly raised question also increases the total."},{"lv":"GAIDU ir izlemts punkts šim apskatam, ja zināms, no kā un ko gaidām un kad pārbaudīsim vēlreiz. ATLIKT vajag datumu vai skaidru atsākšanas nosacījumu. 100% nozīmē “viss šajā apskatā izlemts”; ārējās saistības vēl var turpināties.","en":"WAITING is decided for this review when we know who owes what and when to check again. DEFER needs a date or clear trigger. 100% means every review item has a decision; external obligations can remain open."}],"what":{"lv":"Izejat punktiem cauri sarunā. AI palīdz saprast situāciju, sagatavo atbildi vai nākamo soli. Tu vari pateikt “nosūtīju”, “izdarīts”, “gaidu atbildi”, “atlikt līdz…” vai “šo ignorējam”. Ārēja sūtīšana notiek pēc konkrētā uzdevuma atļaujas.","en":"Work through the items in chat. AI explains the situation, drafts a reply or prepares the next action. You can say “sent”, “done”, “waiting for a reply”, “defer until…” or “ignore this”. External sending follows the specific task authorisation."},"out":{"lv":"Katram izskatītajam punktam ir lēmums, saglabāts statuss un vajadzības gadījumā nākamā pārbaude.","en":"Each reviewed item has a decision, saved state and a next check where needed."},"files":["references/RUN-CONTRACT.md","references/GMAIL-WORKFLOW.md"],"companion":"ai","caption":{"lv":"Lēmums → saglabāšana → nākamais punkts","en":"Decide → save → next item"},"progress":{"title":{"lv":"Apskata lēmumi","en":"Review decisions"},"summary":{"lv":"3 no 5 piemēra punktiem izlemti; diviem vēl vajadzīga tava izvēle.","en":"3 of 5 example items are decided; two still need your choice."},"items":[{"decided":false,"label":{"lv":"Atbildēt par komandas apmācībām","en":"Reply about team training"}},{"decided":true,"label":{"lv":"Atceries savu solījumu līdz 16.00","en":"Remember your promise by 16:00"}},{"decided":true,"label":{"lv":"Atgādināt par nosūtīto piedāvājumu","en":"Follow up on the proposal"}},{"decided":false,"label":{"lv":"Uzrakstīt par nākamo zvanu","en":"Arrange the next call"}},{"decided":true,"label":{"lv":"Gaidu failu no partnera","en":"Waiting for the partner’s file"}}],"note":{"lv":"Izdomāts piemērs · 21.10.2026. · nekas nav nosūtīts. Šī progresa uzskaite ir plūsmas priekšlikums, ne pašreizējās izpildes mērījums.","en":"Fictional example · 21 Oct 2026 · nothing sent. This progress tracking is a workflow proposal, not a live execution measure."}},"summary":{"lv":"AI palīdz sagatavot rīcību. Tu pasaki rezultātu, un AI atjauno konkrētā punkta statusu.","en":"AI helps prepare the action. You report the result and AI updates that item’s state."},"headerIcons":["user","ai","file"],"storageRef":"reviews","stored":{"title":{"lv":"Atjaunojas apskats un aktuālais statuss","en":"Update the review and current state"},"text":{"lv":"Pēc katra lēmuma saglabā rezultātu un nākamo soli. GAIDU paliek atvērts. Python spēj aprēķināt progresu no struktur a11.821 11.821 0 00-3.48-8.413Z\"/><\/svg>"},"build":{"generator":"2.0.0","mode":"internal","manifestSha":"2a198648f417db4aafa5f7c8949cf434db7166103981fc817c71dc636f75b9fd"},"layout":{"tabs":["overview","principles","flow","example","log"],"changesOnly":true,"overviewFiles":false,"filesTitle":{"lv":"Prasmes faili","en":"Skill files"},"filesNote":{"lv":"Galvenā instrukcija, atlases noteikumi un palīgfaili vienā pakotnē.","en":"Main instructions, selection rules and supporting files in one package."},"overviewBrief":{"title":{"lv":"Ko saņemsi","en":"What you get"},"items":[{"title":{"lv":"Svarīgākie nākamie soļi","en":"Priority next actions"},"text":{"lv":"Līdz pieciem punktiem ar pamatojumu un avotu.","en":"Up to five items, each with a reason and source."}},{"title":{"lv":"Atbildes sagatave","en":"A reply draft"},"text":{"lv":"Konkrēts teksts, ko kopā pārskatīt un nosūtīt.","en":"A concrete reply to review together and send."}},{"title":{"lv":"Saglabāts turpinājums","en":"A saved handoff"},"text":{"lv":"Tavi lēmumi un atvērtie jautājumi nākamajam apskatam.","en":"Your decisions and open questions for the next review."}}],"note":{"en":"Start with a few selected conversations. Add verified connections only when useful.","lv":"Sāc ar dažām atlasītām sarunām. Pievieno pārbaudītus savienojumus tad, kad tie ir vajadzīgi."}},"exampleTab":true,"behavior":{"title":{"lv":"Ko COMMS7 dara","en":"What COMMS7 does"},"text":{"lv":"AI pārbauda sarunas kontekstu un iepriekšējos lēmumus, atlasa aktuālo un palīdz sagatavot atbildi. Gmail ziņas sakārto pēc GTD.","en":"AI checks conversation context and previous decisions, selects what matters and helps draft a reply. Gmail messages are organised with GTD labels."},"items":[{"label":"Action","text":{"lv":"Mana nākamā darbība","en":"My next action"}},{"label":"Waiting","text":{"lv":"Gaidu konkrētu rezultātu no cita","en":"A result owed by someone else"}},{"label":"Someday/Maybe","text":{"lv":"Iespējama iecere vēlāk","en":"An optional future idea"}},{"label":"Read/Later","text":{"lv":"Izvēlēta lasāmviela","en":"Selected reading"}}],"note":{"en":"Labels follow existing task authorisation. Filters, unsubscribes and monitoring require their accepted concrete scope and supported tools.","lv":"Etiķetes uztur esošās uzdevuma atļaujas robežās. Filtriem, atteikumiem un monitoram vajag pieņemtu konkrētu tvērumu un pieejamus rīkus."},"docs":[{"file":"SKILL.md","label":{"lv":"Galvenā instrukcija · SKILL.md","en":"Main instruction · SKILL.md"}},{"file":"references/GMAIL-WORKFLOW.md","label":{"lv":"Gmail darbības noteikumi","en":"Gmail operating rules"}}]},"routes":{"aios":{"tab":"principles","anchor":"guide-aios"}},"overview":{"compact":true,"hideRelated":true},"filesTab":"principles"},"guides":{"principles":{"eyebrow":"COMMS7 · SKILL.md","title":{"lv":"Pēc kā COMMS7 pieņem lēmumu","en":"How COMMS7 chooses the next action"},"lead":{"lv":"COMMS7 meklē neatrisinātu saistību un tās nākamo soli. Nelasīta ziņa pati par sevi nav darbs, bet paša solījums paliek svarīgs arī pēc atbildes nosūtīšanas.","en":"COMMS7 looks for unresolved commitments and their next step. An unread message is not itself a task; your promise can remain open after sending a reply."},"sections":[{"title":{"lv":"Kas ir galvenajā SKILL.md","en":"What the main SKILL.md contains"},"text":{"lv":"AI sāk ar šo failu: mērķis, izsaukuma režīms, atlases noteikumi, konteksta avoti un robežas. Detalizētais apļa līgums un izvēles režīmi ir piesaistītajos failos, kurus ielādē pēc vajadzības.","en":"AI starts with this file: purpose, invocation mode, selection rules, context sources and limits. The detailed run contract and optional modes live in linked files loaded when relevant."},"docs":[{"file":"SKILL.md","label":{"lv":"Atvērt galveno instrukciju","en":"Open the main instructions"}},{"file":"references/RUN-CONTRACT.md","label":{"lv":"Pilnais izpildes līgums","en":"Full run contract"}}]},{"title":{"lv":"Pieci pārbaudes jautājumi","en":"Five decision checks"},"rows":[{"label":{"lv":"1. Kam tas adresēts?","en":"1. Who is addressed?"},"text":{"lv":"Vai lūgums tiešām ir tev vai cilvēkam, kura darbību tu koordinē? Grupas pieminējums pats nerada darbu.","en":"Is the request directed at you or someone whose work you coordinate? A group mention alone creates no task."}},{"label":{"lv":"2. Kas ir atvērts?","en":"2. What is unresolved?"},"text":{"lv":"Konkrēts jautājums, paša solījums, saņemams rezultāts vai termiņš; nosaki vienu pārbaudāmu nākamo soli.","en":"Identify the actual question, your promise, expected result or deadline, then one verifiable next step."}},{"label":{"lv":"3. Vai tas jau atrisināts?","en":"3. Is it already resolved?"},"text":{"lv":"Pārbaudi jaunāko sarunu, nosūtīto, citu atļauto kanālu un tavu iepriekšējo lēmumu.","en":"Check the latest thread, sent messages, other authorised channels and your previous decision."}},{"label":{"lv":"4. Kāpēc tagad?","en":"4. Why now?"},"text":{"lv":"Ņem vērā īsto termiņu, sekas, cilvēka kontekstu un pieņemtās FOCUS7 prioritātes. Neizdomā steidzamību.","en":"Use actual deadlines, consequences, person context and accepted FOCUS7 priorities. Do not invent urgency."}},{"label":{"lv":"5. Ko var secināt?","en":"5. What does evidence support?"},"text":{"lv":"Iesaki atbildēt, darīt, piezvanīt, gaidīt, atlikt vai izlaist. Ja vajadzīgais konteksts nav pieejams, nosauc trūkumu.","en":"Recommend replying, doing, calling, waiting, deferring or skipping. If required context is missing, state the gap."}}],"docs":[]},{"title":{"lv":"Kā izvēle parādās Gmail","en":"How decisions appear in Gmail"},"rows":[{"label":"Action / Waiting","text":{"lv":"Man jārīkojas vai gaidu citu. Nosūtīta atbilde var atstāt solītu piegādi atvērtu; abas etiķetes vienā pavedienā var būt pamatotas.","en":"I need to act or am waiting on someone else. A sent reply can leave a promised delivery open; both labels can be justified on one thread."}},{"label":"Someday/Maybe / Read/Later","text":{"lv":"Vēl neuzņemta iecere vai izvēlēta lasīšana. Atlikts reāls solījums saglabā savu darbību un atsākšanas datumu.","en":"An optional future idea or selected reading. A deferred commitment keeps its action and restart date."}},{"label":{"lv":"Filtri un abonementi","en":"Filters and subscriptions"},"text":{"lv":"Piedāvā atkārtojamu šķirošanu vai atteikšanos ar pamatojumu. Konkrēto izmaiņu izpilda tikai pēc pieņemšanas un ar pieejamu rīku.","en":"Proposes repeatable sorting or unsubscribe with a reason. Executes the concrete change only after acceptance and with an available tool."}}],"note":{"lv":"Izmanto esošos konta label nosaukumus. “Ieteikts” un “Gmail izdarīts un pārbaudīts” ir dažādi rezultāti.","en":"Uses existing account label names. “Suggested” and “applied and verified in Gmail” are different results."},"docs":[{"file":"references/GMAIL-WORKFLOW.md","label":{"lv":"Etiķešu un filtru līgums","en":"Label and filter contract"}}]},{"title":{"lv":"Kā tas atšķiras praksē","en":"What this changes in practice"},"items":[{"title":{"lv":"“Paldies!”","en":"“Thanks!”"},"text":{"lv":"Ja jauna jautājuma vai saistības nav, atbildi neprasa un darbu neveido.","en":"With no new question or commitment, no reply or task is needed."}},{"title":{"lv":"“Prezentāciju nosūtīšu rīt”","en":"“I will send the slides tomorrow”"},"text":{"lv":"Atbilde var būt nosūtīta, bet prezentācijas piegāde vēl ir atvērta.","en":"The reply may be sent while the promised delivery remains open."}},{"title":{"lv":"“Atbildēšu piektdien”","en":"“I will reply on Friday”"},"text":{"lv":"Gaidām otras puses atbildi līdz norunātajam datumam; neatgādinām patvaļīgi ātrāk.","en":"Wait for the other party until the agreed date; do not invent an earlier reminder."}},{"title":{"lv":"Reklāma vai jaunumi","en":"Promotion or newsletter"},"text":{"lv":"Parasti neprasa atbildi. Lasīšanai noderīgais var nonākt NEWS7 izvērtēšanā, ja tas ir tavs uzdevums.","en":"Usually requires no reply. Relevant reading can be considered through NEWS7 when that is your task."}}],"note":{"lv":"AI ieteikums nav pieņemts uzdevums. Tu izvēlies; GATAVS aizver tikai nosaukto soli.","en":"An AI suggestion is not an accepted task. You decide; DONE closes only the named action."},"docs":[]},{"title":{"lv":"Kādus rīkus izvēlas","en":"How tools are selected"},"rows":[{"label":"Gmail / WhatsApp","text":{"lv":"Saņemtā un nosūtītā konteksts no atļautā konta; Gmail izvilkums vai WA kolektora metadati vieni nav pilns apskats.","en":"Read received and sent context for the authorised account; a Gmail snippet or WhatsApp metadata alone is not a full review."}},{"label":"CRM7","text":{"lv":"Atrodi pareizo cilvēku un nolasi vajadzīgo pēdējās sarunas kontekstu, ja piešķirtais rīks ir pieejams.","en":"Match the person and read relevant recent context where the granted tool is available."}},{"label":{"lv":"Kalendārs un dokumenti","en":"Calendar and documents"},"text":{"lv":"Izmanto, ja tie vajadzīgi konkrēta termiņa, pieejamības vai piegādes pārbaudei.","en":"Use when needed to verify a particular deadline, availability or delivery."}},{"label":{"lv":"Citi kanāli","en":"Other channels"},"text":{"lv":"LinkedIn, Circle un citus avotus pievieno ar nosauktu kontu, tiesībām un pārbaudītu pārklājumu.","en":"Additional sources need a named account, permissions and verified coverage."}}],"docs":[{"file":"references/PRINCIPLES.md","label":{"lv":"Atlases principu pilnais teksts","en":"Full selection principles"}}]},{"id":"guide-monitoring","title":{"en":"A source signal is not a reply decision","lv":"Avota signāls vēl nav lēmums atbildēt"},"text":{"en":"An authorised activity monitor can detect changed incoming evidence. The COMMS7 review still checks the full conversation and prior decisions before deciding what you owe.","lv":"Autorizēts avota monitors var pamanīt mainītu ienākošo saturu. COMMS7 apskats joprojām pārbauda pilno sarunu un iepriekšējos lēmumus, pirms nosaka, kas tev jādara."},"rows":[{"label":{"en":"Source activity","lv":"Avota aktivitāte"},"text":{"en":"An agreed reader, cadence and private destination; unchanged cycles remain quiet and old history is a baseline.","lv":"Saskaņots lasītājs, ritms un privāts saņēmējs; nemainīgs cikls klusē, vecā vēsture ir sākuma stāvoklis."}},{"label":{"en":"Semantic review","lv":"Semantiskais apskats"},"text":{"en":"A new “thanks” may need no action. An old promise can remain open without a new message. Read latest sent/draft context before proposing a reply.","lv":"Jauns “paldies” var neprasīt rīcību. Vecs solījums paliek atvērts arī bez jaunas ziņas. Pirms atbildes ieteikuma pārbaudi jaunāko nosūtīto un melnrakstus."}}],"note":{"en":"This package includes no connected account, owner schedule or notification service. Verify each actual reader, runner and delivery separately.","lv":"Šajā pakotnē nav pieslēgta konta, īpašnieka grafika vai paziņojumu servisa. Atsevišķi pārbaudi īsto lasītāju, palaidēju un piegādi."},"docs":[{"file":"references/MONITORING.md","label":{"en":"Optional monitoring contract","lv":"Izvēles monitora līgums"}}]},{"id":"guide-aios","title":{"lv":"COMMS7 kopējā AIOS sistēmā","en":"COMMS7 in the AIOS system"},"text":{"lv":"Saistība ar AIOS: augsta. COMMS7 apvieno biznesa virzienu, aktuālo darbu un attiecību vēsturi, lai izvēlētos tev nozīmīgu nākamo soli.","en":"AIOS integration: high. COMMS7 combines business direction, current work and relationship history to choose a next step that matters to you."},"rows":[{"label":"01 · Constitution","text":{"lv":"North Star dod ilgtermiņa virzienu: kuras iespējas atbilst pieņemtajiem mērķiem? Tas palīdz noteikt vērtību līdzās īstiem termiņiem un saistībām.","en":"North Star supplies direction: which opportunities support accepted goals? It adds strategic relevance alongside actual deadlines and commitments."}},{"label":"02 · Memory","text":{"lv":"Projektu fakti un iepriekšējās vienošanās precizē atbildi. Pieņemtie ilglaicīgie secinājumi nonāk pareizajā projekta/CRM avotā; privātie apskati paliek īpašnieka datu mapē.","en":"Project facts and prior agreements make the reply specific. Accepted lasting outcomes go to the right project/CRM source; private reviews remain in owner storage."}},{"label":"03 · Skills","text":{"lv":"CRM7 dod cilvēka kontekstu; FOCUS7 apstrādā pieņemtas prioritāšu izmaiņas; NEWS7 var izvērtēt prasītu lasāmvielu. Piešķirtie aģenti palīdz savās lomās.","en":"CRM7 supplies person context; FOCUS7 handles accepted priority changes; NEWS7 can assess requested reading. Granted agents contribute within their roles."}},{"label":"04 · Tools","text":{"lv":"Izmanto kopīgos, piešķirtos kontu savienojumus un rīkus. Pārbauda to pieejamību un svaigumu; katrai prasmei nav jābūvē atsevišķs pieslēgums.","en":"Uses shared, granted account connections and tools. Checks availability and freshness; every skill need not build a separate connection."}},{"label":"05 · Focus","text":{"lv":"Aktīvie projekti, uzdevumi un pieņemtās pauzes nosaka, kas svarīgs tagad. Ziņa par aktuālu piegādi saņem projekta kontekstu; jauna ideja automātiski nekļūst par prioritāti.","en":"Active projects, tasks and accepted pauses determine what matters now. A current delivery message gains project context; a new idea does not automatically become a priority."}}],"note":{"lv":"“Augsta” ir kvalitatīvs saistības vērtējums, ne izmērīta precizitāte. Piemērs: aktīvas piegādes turpinājumu salīdzina ar jauna projekta piedāvājumu, ņemot vērā North Star, Focus un vienošanos vēsturi. Dotu solījumu neatceļ arī tad, ja tas ir ārpus Focus.","en":"“High” is a qualitative integration assessment, not measured accuracy. Example: compare a current delivery follow-up with a new project offer using North Star, Focus and prior agreements. Commitments outside Focus still count."},"docs":[{"file":"references/AIOS-INTEGRATION.md","label":{"lv":"Pilnā AIOS saikne","en":"Full AIOS integration"}},{"file":"references/STORAGE-PLAN.md","label":{"lv":"Failu izvietojuma priekšlikums","en":"Storage proposal"}}],"items":[{"title" function wirePath(a,b,kind){

 const x1=p.x+60,y1=p.y+30,x2=q.x,y2=q.y+30,dx=Math.max(26,(x2-x1)/2);
 return 'M'+x1+' '+y1+' C'+(x1+dx)+' '+y1+','+(x2-dx)+' '+y2+','+x2+' '+y2;
