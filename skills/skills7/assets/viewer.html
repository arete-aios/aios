<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>@@TITLE@@</title>
<style>
@@FONTS@@
:root{--bg:#0A121F;--surface:#101D2D;--surface-alt:#132237;--ink:#F9FAFC;--text:#C4CBD6;--muted:#899AAF;--line:#26384B;--blue:#6AA9F0;--teal:#72C8D1;--primary:#0081FF;--primary-ink:#fff;--sample:#D0B16A;--py:#E8C35A;--skill:#B48CF0;--grid:rgba(137,154,175,.16);--shadow:0 18px 50px rgba(0,0,0,.35);color-scheme:dark}
:root[data-theme=light]{--bg:#F5F7FA;--surface:#FFFFFF;--surface-alt:#EDF2F8;--ink:#0A121F;--text:#2C3A4C;--muted:#5C6B7F;--line:#D6DEE8;--blue:#0B63C9;--teal:#0E7C87;--primary:#0072E5;--primary-ink:#fff;--sample:#8A6A1F;--py:#A27A12;--skill:#7348C2;--grid:rgba(92,107,127,.18);--shadow:0 18px 40px rgba(10,18,31,.10);color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
a{color:var(--blue);text-underline-offset:3px}
button,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.eyebrow{font:11px/1.5 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin:0 0 12px}
h1,h2,.serif{font-family:Literata,Georgia,serif;color:var(--ink);font-weight:600;letter-spacing:-.015em}
h1{font-size:clamp(2rem,3.4vw,2.85rem);line-height:1.1;margin:0 0 18px;white-space:pre-line}
h2{font-size:clamp(1.4rem,2.1vw,1.75rem);line-height:1.2;margin:0 0 8px}
h3{font-size:1.02rem;line-height:1.35;color:var(--ink);margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
.lead{font-size:1.08rem;line-height:1.65;max-width:42em}
.sub{color:var(--muted);max-width:48em}
.fine{font-size:.82rem;color:var(--muted)}
.mono{font-family:"JetBrains Mono",monospace}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:44px;height:22px;flex:0 0 auto}
.brand .w{font-size:1.05rem;line-height:1.1}.brand .w b{font-weight:700}.brand .w span{color:var(--muted)}
.brand small{display:block;font:10px/1 "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.14em;margin-top:4px}
.top-actions{display:flex;align-items:center;gap:8px}
.chip{font:11px/1 "JetBrains Mono",monospace;border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:var(--muted);white-space:nowrap;text-decoration:none}
.chip.internal{color:var(--sample);border-color:color-mix(in srgb,var(--sample) 45%,transparent)}
a.chip{color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--bg)}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:.8rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface-alt);color:var(--ink)}
.ghost{border:0;background:transparent;color:var(--muted);font-size:.8rem;cursor:pointer;padding:6px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 12px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:.95rem}
.tabs button:first-child{padding-left:0}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--primary)}
main.wrap{padding-top:44px;padding-bottom:72px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 17px;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.wide{width:100%;margin-top:14px}
.btn:hover{filter:brightness(1.08)}
.link{border:0;background:none;color:var(--blue);cursor:pointer;padding:0;font-size:.92rem;text-align:left}
.actions{display:flex;gap:14px 18px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:40px;align-items:start}
.side{display:grid;gap:16px;position:sticky;top:118px}
.qs{margin-top:30px;border-color:color-mix(in srgb,var(--primary) 35%,var(--line))}
.prompt{font:12.5px/1.65 "JetBrains Mono",monospace;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;white-space:pre-wrap;color:var(--text);margin:12px 0 14px}
.ex .meta,.paper .meta{font:11px/1.4 "JetBrains Mono",monospace;color:var(--muted);margin-bottom:6px}
.item{padding:13px 0;border-top:1px solid var(--line)}
.item h4{margin:0 0 4px;font-size:.97rem;color:var(--ink);font-weight:600;line-height:1.35}
.item p{margin:0 0 6px;font-size:.89rem;line-height:1.55}
.item .next{border-left:2px solid var(--primary);padding-left:10px;margin:8px 0}
.item .next b{color:var(--blue);font-weight:600}
.item .src{font-size:.8rem;margin:0}
.sample-note{font-size:.79rem;line-height:1.5;color:var(--muted);margin:12px 0 0;display:flex;gap:9px}
.sample-note:before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--sample);margin-top:6px}
.rel{display:grid;gap:12px;margin-top:16px}
.rel .card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:18px}
.rel .card p{margin:0 0 6px;font-size:.9rem}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ch h3{font-family:Literata,Georgia,serif;font-size:1.3rem}
.ch .eyebrow{margin:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.kv span:first-child{color:var(--muted)}.kv span:last-child{color:var(--ink);text-align:right}
.fit{margin-top:14px}
.fit .row{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--ink);font-weight:600}
.fit .row span{font:12px/1.6 "JetBrains Mono",monospace;color:var(--teal)}
.bar{height:5px;background:var(--line);border-radius:3px;margin:6px 0}
.bar i{display:block;height:100%;background:var(--teal);border-radius:3px}
.side hr{border:0;border-top:1px solid var(--line);margin:18px 0 14px}
.side select{width:100%;margin:8px 0 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metrics b{display:block;font:600 2.1rem/1.1 Literata,Georgia,serif;color:var(--sample);margin:4px 0 2px}
.metrics small{font-size:.8rem;color:var(--muted);font-family:"JetBrains Mono",monospace}
.tok{margin:14px 0 4px;color:var(--ink)}.tok b{font-family:"JetBrains Mono",monospace}
.tcols{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px;margin-top:26px;align-items:start}
.tcol{padding:0;overflow:hidden}
.tch{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.tch .mono{font-size:11px;color:var(--muted)}
.tch h2{margin:4px 0 4px;font-size:1.5rem}
.tch p{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.tch .req{color:var(--teal);font-size:.82rem;margin:10px 0 0}
.stepchips,.fl-row{display:flex;flex-wrap:wrap;gap:6px}
.fl{font:11.5px/1.2 "JetBrains Mono",monospace;border:1px solid var(--line);background:var(--bg);color:var(--blue);border-radius:6px;padding:6px 8px;cursor:pointer;text-align:left}
.trow{border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) 14px;gap:12px;padding:14px 20px;align-items:start}
.trow summary::-webkit-details-marker{display:none}
.tile{width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center;border:1px solid var(--line);flex:0 0 auto}
.tile svg{width:17px;height:17px}
.tn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tn b{color:var(--ink);font-weight:600;font-size:.94rem}
.badge{font-style:normal;font-size:.68rem;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.b-minimum-path,.b-required-capability,.b-required{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 50%,transparent)}
.tp{display:block;font-size:.86rem;margin:3px 0 6px}
.use{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--muted)}
.use b{font:11px "JetBrains Mono",monospace;color:var(--ink)}
.segs{display:inline-flex;gap:3px}.segs i{width:12px;height:5px;border-radius:2px;background:var(--line)}.segs i.on{background:var(--teal)}
.plus{font-style:normal;color:var(--muted);margin-top:4px;transition:transform .15s}
.trow[open] .plus{transform:rotate(45deg)}
.tmore{padding:0 20px 14px 62px;font-size:.84rem}
.tmore p{margin:0 0 6px}.tmore b{color:var(--ink);font-weight:600}
.scale{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;font-size:.8rem;color:var(--muted)}
.scale b{font-family:"JetBrains Mono",monospace;color:var(--teal);font-weight:400}
.block{margin-top:80px}
.block:first-child{margin-top:0}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.types .card p{font-size:.9rem;margin:0}
.types .ext{display:inline-block;margin-bottom:10px}
.ext{font:10px/1 "JetBrains Mono",monospace;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:5px 7px;text-align:center}
details.files,details.adv{margin-top:22px;border-top:1px solid var(--line)}
details.files>summary,details.adv>summary{cursor:pointer;color:var(--ink);font-weight:600;padding:16px 0;font-size:1.02rem}
.fgroup{margin-top:18px}
.fgroup h4{margin:0 0 4px;color:var(--ink);font-size:.95rem}
.flist{list-style:none;padding:0;margin:8px 0 0;border-top:1px solid var(--line)}
.frow{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 6px;text-align:left;cursor:pointer}
.frow:hover{background:var(--surface)}
.fname{display:block;font:12.5px/1.4 "JetBrains Mono",monospace;color:var(--ink);word-break:break-all}
.fdesc{display:block;font-size:.84rem;color:var(--muted);margin-top:2px}
.fmeta{font:11px/1.6 "JetBrains Mono",monospace;color:var(--muted);text-align:right;white-space:nowrap}
.fmeta .h{color:var(--sample)}
.advgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:start;padding-bottom:10px}
.adv h4{margin:16px 0 4px;color:var(--ink);font-size:.95rem}.adv h4:first-child{margin-top:0}
.adv p{font-size:.9rem}
.hbars{display:grid;gap:14px}
.hb span{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;margin-bottom:4px}.hb span b{font:12px "JetBrains Mono",monospace;color:var(--ink)}
.hb .track{height:12px;background:var(--surface-alt);border-radius:6px;overflow:hidden}
.hb .track i{display:block;height:100%;min-width:3px;border-radius:6px;background:var(--muted)}
.hb:nth-child(2) .track i{background:var(--teal)}.hb:nth-child(3) .track i{background:var(--blue)}
.flowbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid;margin-right:5px;vertical-align:-2px}
.lg-you{border-color:var(--teal)!important}.lg-ai{border-color:var(--primary)!important}.lg-py{border-color:var(--py)!important}.lg-tool{border-color:var(--muted)!important}.lg-skill{border-color:var(--skill)!important}
.cwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background-color:var(--surface);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:20px 20px}
.csizer{position:relative}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.note{position:absolute;top:10px;bottom:10px;border-radius:12px;background:color-mix(in srgb,var(--surface-alt) 70%,transparent);border:1px solid var(--line)}
.note span{position:absolute;left:12px;top:9px;font:11px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wires{position:absolute;left:0;top:0;overflow:visible}
.wires path{fill:none;stroke:var(--muted);stroke-width:1.6;opacity:.75}
.wires path.loop{stroke:var(--teal);stroke-dasharray:5 5}
.wires path.dim{opacity:.12}
.wires text{font:11px "JetBrains Mono",monospace;fill:var(--teal)}
.node{position:absolute;width:110px;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.nb{width:60px;height:60px;border-radius:14px;background:var(--surface);border:2px solid var(--muted);display:grid;place-items:center;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.18);transition:box-shadow .15s,transform .15s}
.nb .tile{width:34px;height:34px;border:0}
.nb .tile svg{width:20px;height:20px}
.k-you .nb{border-color:var(--teal)}.k-ai .nb{border-color:var(--primary)}.k-py .nb{border-color:var(--py)}.k-skill .nb{border-color:var(--skill)}
.node.opt .nb{border-style:dashed}
.node.dim{opacity:.22}
.node[aria-pressed=true] .nb{box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 40%,transparent);transform:translateY(-1px)}
.nl{font-size:12px;line-height:1.3;color:var(--ink);font-weight:600}
.nk{position:absolute;top:-9px;right:-9px;font:10px/1 "JetBrains Mono",monospace;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 5px;color:var(--muted)}
.nu{display:inline-flex;gap:2px}.nu i{width:7px;height:4px;border-radius:2px;background:var(--line)}.nu i.on{background:var(--teal)}
.panel{margin-top:14px}
.ph{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.ph h3{font-family:Literata,Georgia,serif;font-size:1.35rem;margin:0 0 6px}
.kind{font:11px/1 "JetBrains Mono",monospace;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);margin-right:6px}
.kind.k-you{color:var(--teal)}.kind.k-ai{color:var(--blue)}.kind.k-py{color:var(--py)}.kind.k-skill{color:var(--skill)}
.pg{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:24px;border-top:1px solid var(--line);padding-top:14px}
.pg p{font-size:.92rem}.pg .eyebrow{margin-bottom:6px;color:var(--muted)}
.hint{display:none;font-size:.78rem;color:var(--muted);margin:8px 2px 0}
/*JOURNEY:start*/
/* Optional ordered workflow; activated only by flow.presentation = journey. */
.journey-goal,.journey-artifact,.journey-sources,.journey-rhythm{position:absolute;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:15px 17px;color:var(--text)}
.journey-goal{border-left:3px solid var(--teal)}
.journey-goal .eyebrow{margin:0 0 8px;color:var(--teal)}
.journey-goal p{font-size:14px;line-height:1.5;margin:0}
.journey-artifact{display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;font:inherit}
.journey-artifact strong{display:block;font-size:13px;line-height:1.35;color:var(--ink)}
.journey-artifact small{display:block;font-size:11px;line-height:1.45;color:var(--muted);margin-top:5px}
.journey-artifact .tile{flex-shrink:0}
.journey-artifact[aria-pressed=true]{border-color:var(--primary)}
.journey-rhythm{font-size:12px;line-height:1.45;display:flex;align-items:center;gap:9px}
.journey-rhythm .tile{width:28px;height:28px;flex-shrink:0}
.journey-rhythm strong{display:block;color:var(--ink)}
.journey-sources{padding:12px 14px;font-size:11px;line-height:1.4}
.journey-sources p{margin:0 0 8px;color:var(--muted);font-size:10px}
.journey-channels{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.journey-channel{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--ink)}
.journey-channel .tile{width:24px;height:24px;border-radius:6px}
.journey-channel .tile svg{width:16px;height:16px}
.journey-sources .journey-channel{font-size:10px}.journey-sources .journey-channels+.journey-channels{margin-top:8px}
.journey-optional{color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.journey-summary{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:3px}
.journey-companion{position:absolute;right:-9px;bottom:-7px;border:1px solid var(--line);border-radius:7px;background:var(--surface);display:flex;padding:2px}
.journey-companion .tile{width:19px;height:19px}.journey-companion .tile svg{width:15px;height:15px}
.journey-caption{font-size:.82rem;color:var(--muted);margin:12px 0 24px;max-width:850px}
.journey-heading{margin:34px 0 18px;font-family:Literata,Georgia,serif;font-size:1.6rem;color:var(--ink)}
.journey-steps{display:grid;gap:14px}
.journey-step{min-width:0;scroll-margin-top:100px;padding:26px 28px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.journey-step.is-selected{border-color:color-mix(in srgb,var(--primary) 60%,var(--line))}
.journey-step-head{display:flex;gap:15px;align-items:flex-start;margin-bottom:15px}
.journey-step-head .tile{flex-shrink:0}.journey-step-head .eyebrow{margin:0 0 3px;color:var(--muted);font-size:11px}
.journey-step h2{font-family:Literata,Georgia,serif;font-size:1.45rem;line-height:1.3;margin:0;color:var(--ink)}
.journey-step p{max-width:900px;font-size:.95rem;line-height:1.7;margin:10px 0}
.journey-example{border-left:2px solid var(--teal);padding:10px 16px;margin:16px 0;background:var(--surface-alt);border-radius:0 8px 8px 0}
.journey-step .journey-result{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.journey-result b{color:var(--teal)}.journey-docs{margin-top:12px}
.journey-docs .link{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.journey-docs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem}
.journey-icons{display:flex;gap:5px;align-items:center;flex-shrink:0}
.journey-storage{display:flex;gap:12px;align-items:flex-start;padding:15px;border:1px solid var(--line);border-radius:10px;margin:16px 0;background:var(--surface-alt)}
.journey-storage .tile{flex-shrink:0}.journey-storage p{font-size:.86rem;margin:3px 0}.journey-storage a{overflow-wrap:anywhere;font-family:"JetBrains Mono",monospace;font-size:.75rem}
.journey-helper{display:flex;gap:12px;border:1px solid color-mix(in srgb,var(--py) 50%,var(--line));border-radius:10px;padding:15px;margin:16px 0;background:var(--surface-alt)}
.journey-helper .tile{flex-shrink:0}.journey-helper svg,.k-py .nb svg{fill:#3776AB}.journey-helper p{font-size:.86rem;margin:3px 0}
@media(max-width:500px){.journey-icons .tile{width:32px;height:32px}}
.journey-progress{border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0;max-width:690px;background:var(--surface-alt)}
.journey-progress .journey-meter{height:7px;border-radius:5px;background:var(--line);margin:12px 0;overflow:hidden}
.journey-meter i{display:block;height:100%;background:var(--teal)}
.journey-progress ul{margin:12px 0;padding-left:20px;font-size:.88rem;line-height:1.8}
.journey-progress .fine{font-size:.76rem;margin-bottom:0}
.journey-timing{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.journey-timing>div{background:var(--surface-alt);border:1px solid var(--line);border-radius:12px;padding:18px}
.journey-timing h3{margin:0 0 6px;color:var(--ink);font-size:1rem}
@media(max-width:600px){.journey-step{padding:20px 18px}.journey-timing{grid-template-columns:1fr}.journey-step h2{font-size:1.2rem}.journey-step-head{gap:10px}}

function wirePath(a,b,kind){
 const p=P(a),q=P(b);
 if(kind==='loop'){const x1=p.x,y1=p.y+30,x2=q.x+30,y2=q.y+60;return 'M'+x1+' '+y1+' C'+(x1-220)+' '+(F.height+30)+','+(x2-10)+' '+(F.height+30)+','+x2+' '+y2;}
 if(kind==='side'){const x1=p.x+60,y1=p.y+30,x2=q.x+60,y2=q.y+30;return 'M'+x1+' '+y1+' C'+(x1+46)+' '+y1+','+(x2+46)+' '+y2+','+x2+' '+y2;}
 const x1=p.x+60,y1=p.y+30,x2=q.x,y2=q.y+30,dx=Math.max(26,(x2-x1)/2);
 return 'M'+x1+' '+y1+' C'+(x1+dx)+' '+y1+','+(x2-dx)+' '+y2+','+x2+' '+y2;
}

 +(simple?[n.summary||n.what]:(n.paragraphs||[n.what])).map(p=>'<p>'+esc(L(p))+'</p>').join('')+storage+helper

 +connections+social+heading('nextTitle')+'<div class="setup-grid"><div class="setup-card"><h3>'+esc(L(o.helper.title))+'</h3><p>'+esc(L(o.helper.current))+'</p><p>'+esc(L(o.helper.planned))+'</p><a href="'+esc(o.helper.href)+'">'+esc(L(c.helperLink))+' ↗</a></div><div class="setup-card"><h3>'+esc(L(c.channelsTitle))+'</h3><p>'+esc(L(o.extensions))+'</p><h3 style="margin-top:18px">'+esc(L(c.cadenceTitle))+'</h3><p>'+esc(L(o.cadence))+'</p></div></div></section>';
}
function exampleTags(item){return '<span class="example-tags">'+['channel','priority','person'].filter(k=>item[k]).map(k=>'<span'+(k==='priority'&&item.attention?' class="attention"':'')+'>'+esc(L(item[k]))+'</span>').join('')+'</span>';}
function exampleDetail(ex,item,heading){
 return (heading?exampleTags(item)+'<h3>'+esc(L(item.title))+'</h3>':'')
 +(item.quote?'<p class="eyebrow">'+esc(L(item.contextLabel))+'</p><blockquote class="example-quote">'+esc(L(item.quote))+'</blockquote>':'')
 +(item.why?'<p>'+esc(L(item.why))+'</p>':'')+(item.action?'<p><strong>'+esc(L(ex.actionLabel))+'</strong> '+esc(L(item.action))+'</p>':'')
 +(item.draft||item.followup?'<div class="example-draft"><span class="eyebrow">'+esc(L(item.draft?ex.draftLabel:ex.waitLabel))+'</span><p>'+esc(L(item.draft||item.followup))+'</p>'+(item.draftNote?'<p class="fine">'+esc(L(item.draftNote))+'</p>':'')+(item.draft?'<button type="button" class="btn" data-preview-copy="'+esc(item.id)+'">'+esc(L(ex.copyLabel))+'</button>':'')+'</div>':'')
 +(item.decisionLabel?'<div class="example-outcome">'+esc(L(item.decisionLabel))+'</div>':'')
 +(item.source?'<div class="example-source">'+(item.sourceUrl&&/^https?:\/\//i.test(item.sourceUrl)?'<a href="'+esc(item.sourceUrl)+'" target="_blank" rel="noopener">'+esc(L(item.source))+' ↗</a>':esc(L(item.source)))+'</div>':'');
}
function renderExample(){
 const ex=D.preview;if(!ex)return '';
 const p=ex.progress,stats=p?[p.total,p.decided,p.total-p.decided]:[],selected=ex.items.find(i=>i.id===previewItem)||ex.items[0];
 const controls=ex.layouts?'<div class="example-top"><div class="seg" role="group">'+['desk','cards'].map(k=>'<button type="button" data-preview-layout="'+k+'" aria-pressed="'+(previewLayout===k)+'">'+esc(L(ex.layouts.labels[k]))+'</button>').join('')+'</div><p>'+esc(L(ex.layouts.note))+'</p></div>':'';
 const row=item=>icon(item.icon)+'<span class="example-row-copy">'+exampleTags(item)+'<strong>'+esc(L(item.title))+'</strong><span class="example-brief">'+esc(L(item.brief||item.action))+'</span></span>';
 const body=previewLayout==='cards'?'<div class="example-cards">'+ex.items.map(item=>'<details class="example-card'+(item.waiting?' example-wait':'')+'"><summary>'+row(item)+'</summary><div class="example-card-body">'+exampleDetail(ex,item,false)+'</div></details>').join('')+'</div>':'<div class="example-desk"><div class="example-inbox">'+ex.items.map(item=>'<button type="button" class="example-row" data-preview-item="'+esc(item.id)+'" aria-controls="example-detail" aria-pressed="'+(selected&&selected.id===item.id)+'">'+row(item)+'</button>').join('')+'</div><article id="example-detail" class="example-detail" aria-live="polite">'+(selected?exampleDetail(ex,selected,true):'')+'</article></div>';
 return '<div class="example-wrap"><p class="eyebrow">'+esc(L(ex.eyebrow))+'</p><h1>'+esc(L(ex.title))+'</h1><p class="lead">'+esc(L(ex.lead))+'</p><span class="example-label">'+esc(L(ex.label))+'</span>'+controls
 +'<div class="example-hero"><p class="eyebrow">'+esc(L(ex.period))+'</p><h2>'+esc(L(ex.headline))+'</h2><p>'+esc(L(ex.summary))+'</p>'
 +(p?'<div class="example-stats">'+stats.map((n,i)=>'<div><b>'+n+'</b><span>'+esc(L((ex.statLabels||[])[i]))+'</span></div>').join('')+'</div><p class="example-progress">'+esc(L(ex.progressLabel))+' '+(p.percent==null?'—':p.percent+'%')+' · '+esc(L(ex.progressNote))+'</p>':'')
 +'</div>'+body+'<p class="example-foot">'+esc(L(ex.note))+'</p>'+(ex.sourceDoc?docBtn(ex.sourceDoc,L(ex.sourceLabel)):'')+'</div>';
}
/*LAYOUT:end*/
/* ---------- Log ---------- */
function changesList(){return '<ol class="clog">'+D.changelog.map(c=>'<li><span class="v">'+esc(c.version)+'<small>'+esc(c.date)+'</small></span><ul>'+(c.changes||[]).map(x=>'<li>'+esc(L(x))+'</li>').join('')+'</ul></li>').join('')+'</ol>';}
function renderLog(){
/*LAYOUT:start*/
 if(D.layout&&D.layout.changesOnly)return '<p class="eyebrow">'+esc(t('tab_log'))+'</p><h1>'+esc(t('changes_title'))+'</h1><ol class="clog">'+D.changelog.map(c=>'<li><span class="v">'+esc(c.version)+'<small>'+esc(c.date)+'</small></span><ul>'+(c.changes||[]).map(x=>'<li>'+esc(L(x))+'</li>').join('')+'</ul></li>').join('')+'</ol>';
/*LAYOUT:end*/
 const op=D.outputPreviews,views=(op?['out']:[]).concat(['runs','changes']).concat(D.owner?['owner']:[]);
 if(!views.includes(logView))logView=views[0];
 let body='';
 if(logView==='out'){
  const items=op.items.map(it=>({title:L(it.title),what:L(it.summary),next:L(it.action)})),fmts=op.channels||['email','slack','html'];
  if(!fmts.includes(logFmt))logFmt=fmts[0];
  const seg='<div class="seg" role="group">'+fmts.map(f=>'<button type="button" data-logfmt="'+f+'" aria-pressed="'+(f===logFmt)+'">'+esc(t('fmt_'+f))+'</button>').join('')+'</div>';
  let view;
  if(logFmt==='slack')view='<div class="slack"><div class="bot">'+esc(S.name.slice(0,4))+'</div><div><div class="who">'+esc(S.name)+'<em>APP</em></div><p><b>'+esc(L(op.subject))+'</b> · '+esc(L(op.period))+'</p>'+items.map(it=>'<div class="si"><b>'+esc(it.title)+'</b><span>'+esc(it.what)+'</span>'+(it.next?'<span>→ '+esc(it.next)+'</span>':'')+'</div>').join('')+'</div></div>';
  else if(logFmt==='html')view='<div class="paper"><div class="bar0"><i></i><i></i><i></i></div><div class="eb"><p class="meta">'+esc(S.name)+'</p><h3>'+esc(L(op.subject))+'</h3><p class="meta">'+esc(L(op.period))+'</p>'+itemsHTML(items)+'</div></div>';
  else view='<div class="paper"><div class="eh"><span>'+esc(t('email_from'))+'</span><span>'+esc(S.name)+'</span><span>'+esc(t('email_to'))+'</span><span>'+esc(t('email_to_val'))+'</span><span>'+esc(t('email_subject'))+'</span><span>'+esc(L(op.subject))+'</span></div><div class="eb"><h3>'+esc(L(op.subject))+'</h3><p class="meta">'+esc(L(op.period))+'</p>'+itemsHTML(items)+'</div></div>';
  body='<div class="flowbar" style="margin-top:0"><div><p class="eyebrow" style="margin:0">'+esc(L(op.label))+'</p><p class="fine" style="margin:4px 0 0">'+esc(L(op.note))+'</p></div>'+seg+'</div>'+view;
 }else if(logView==='runs'){
  body=D.runs.length?'<ol class="clog">'+D.runs.map(r=>'<li><span class="v">'+esc(r.version||'')+'<small>'+esc(String(r.date||'').slice(0,10))+'</small></span><div><b style="color:var(--ink)">'+esc(L(r.title))+'</b> · <span class="fine">'+esc(L(r.status))+'</span><p class="fine" style="margin:4px 0 0">'+esc(L(r.summary))+'</p>'+(r.output?docBtn(r.output):'')+(r.url?' <a class="link" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.urlLabel?L(r.urlLabel):r.url.replace(/^https?:\/\//,''))+' ↗</a>':'')+'</div></li>').join('')+'</ol>':'<p class="fine">'+esc(t('no_runs'))+'</p>';
 }else if(logView==='owner'){
  const o=D.owner;body='<div class="card owner"><p class="eyebrow">'+esc(t('log_owner'))+'</p><h3>'+esc(L(o.status))+'</h3><p>'+esc(L(o.summary))+'</p><ul>'+o.links.map(l=>'<li><a href="'+esc(l.href)+'">'+esc(L(l.title))+'</a></li>').join('')+'</ul><p class="fine" style="margin:12px 0 0">'+esc(t('owner_note'))+'</p></div>';
 }else{
  body='<ol class="clog">'+D.changelog.map(c=>'<li><span class="v">'+esc(c.version)+'<small>'+esc(c.date)+'</small></span><ul>'+(c.changes||[]).map(x=>'<li>'+esc(L(x))+'</li>').join('')+'</ul></li>').join('')+'</ol>';
 }
 return '<p class="eyebrow">'+esc(t('log_eyebrow'))+'</p><h1>'+esc(t('log_title'))+'</h1><div class="seg subtabs" role="group">'+views.map(v=>'<button type="button" data-logview="'+v+'" aria-pressed="'+(v===logView)+'">'+esc(t('log_'+v))+'</button>').join('')+'</div>'+body;
}
/* ---------- Shell ---------- */
const renderers={overview:renderOverview,how:renderHow,flow:renderFlow,log:renderLog/*LAYOUT:start*/,settings:renderSettings,example:renderExample,principles:()=>renderGuide('principles'),aios:()=>renderGuide('aios')/*LAYOUT:end*/};
function paint(id){$('p-'+id).innerHTML=renderers[id]();if(id==='flow')fitCanvas();}
function activate(id,push){
/*LAYOUT:start*/
 const route=D.layout&&D.layout.routes&&D.layout.routes[id];
 if(route){id=route.tab;if(route.settingsView)settingsView=route.settingsView;if(TABS.includes(id))paint(id);}
/*LAYOUT:end*/
 if(!TABS.includes(id))id='overview';tab=id;
 for(const b of document.querySelectorAll('[role=tab]')){const on=b.dataset.tab===id;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;}
 for(const p of document.querySelectorAll('[role=tabpanel]'))p.hidden=p.id!=='p-'+id;
 if(id==='flow')fitCanvas();
/*LAYOUT:start*/
 if(route&&route.anchor&&TABS.includes(route.tab))requestAnimationFrame(()=>{const target=$(route.anchor);if(target)target.scrollIntoView({block:'start'});});
/*LAYOUT:end*/
 if(push&&location.hash!=='#'+id){try{history.replaceState(null,'','#'+id)}catch(e){location.hash=id}}
}
function render(){
 document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;
 for(const b of document.querySelectorAll('[data-lang]'))b.setAttribute('aria-pressed',String(b.dataset.lang===lang));
 $('theme').textContent=t(theme==='dark'?'theme_light':'theme_dark');$('ver').textContent='v'+S.version;$('skillname').textContent=S.name;
 if(D.internal){$('internal').hidden=false;$('internal').textContent=t('internal');}
 if(D.compare){const c=$('compare');c.hidden=false;c.href=D.compare.href;c.textContent=L(D.compare.label);}
 $('tabs').innerHTML=TABS.map(id=>'<button type="button" role="tab" data-tab="'+id+'">'+esc(t('tab_'+id))+'</button>').join('');
 $('panels').innerHTML=TABS.map(id=>'<section role="tabpanel" id="p-'+id+'" hidden></section>').join('');
 for(const id of TABS)paint(id);
 $('foot').textContent=t('foot',{name:S.name,author:S.author,license:S.license,gen:D.build.generator});
 $('dlg-copy').textContent=t('copy_file');$('dlg-dl').textContent=t('download');$('dlg-close').textContent=t('close');
 activate(tab,false);
}
function openDoc(path,anchor){
 const f=D.files[path];if(!f)return;current=path;$('dlg-name').textContent=path;
 const body=$('dlg-body'),txt=f.encoding==='base64'?'Binary file · '+f.bytes+' bytes\nDownload this original asset to use it.':f.text;let i=-1;
 $('dlg-copy').disabled=f.encoding==='base64';
 if(anchor){const re=/^(#{1,6})\s+(.+)$/gm;let m;while((m=re.exec(txt))){if(slug(m[2])===anchor){i=m.index;break;}}}
 if(i>=0){let j=txt.indexOf('\n',i);if(j<0)j=txt.length;body.innerHTML=esc(txt.slice(0,i))+'<mark id="dlg-mark">'+esc(txt.slice(i,j))+'</mark>'+esc(txt.slice(j));}else body.textContent=txt;
 const dlg=$('dlg');if(!dlg.open){if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');}
 const m=$('dlg-mark');body.scrollTop=m?m.offsetTop-24:0;
}
document.addEventListener('click',async ev=>{
 const el=ev.target.closest('button,a');if(!el)return;
 if(el.dataset.tab){activate(el.dataset.tab,true);window.scrollTo(0,0);return;}
 if(el.classList.contains('brand')){ev.preventDefault();activate('overview',true);window.scrollTo(0,0);return;}
 if(el.dataset.lang){lang=el.dataset.lang;store.set('skills7.lang',lang);render();return;}
 if(el.id==='theme'){theme=theme==='dark'?'light':'dark';store.set('skills7.theme',theme);render();return;}
/*JOURNEY:start*/
 if(el.dataset.node&&F.presentation==='journey'){node=el.dataset.node;for(const b of document.querySelectorAll('[data-node]'))b.setAttribute('aria-pressed',String(b.dataset.node===node));const target=byId(node).detailFor||node;for(const a of document.querySelectorAll('.journey-step'))a.classList.toggle('is-selected',a.id==='flow-step-'+target);const detail=$('flow-step-'+target);if(detail)detail.scrollIntoView({behavior:'smooth',block:'start'});return;}
/*JOURNEY:end*/
 if(el.dataset.node){node=el.dataset.node;for(const b of document.querySelectorAll('[data-node]'))b.setAttribute('aria-pressed',String(b.dataset.node===node));$('panel').innerHTML=panelHTML();return;}
 if(el.dataset.mode){mode=el.dataset.mode;paint('flow');return;}
 if(el.dataset.logview){logView=el.dataset.logview;paint('log');return;}
 if(el.dataset.logfmt){logFmt=el.dataset.logfmt;paint('log');return;}
 if(el.dataset.open){openDoc(el.dataset.open,el.dataset.anchor);return;}
/*LAYOUT:start*/
 if(el.dataset.settingsView&&['setup','changes'].includes(el.dataset.settingsView)){settingsView=el.dataset.settingsView;paint('settings');document.querySelector('[data-settings-view="'+settingsView+'"]').focus();return;}
 if(el.dataset.copyPath){toast(await copyText(el.dataset.copyPath)?t('copied'):t('copy_fail'));return;}
 if(el.dataset.previewLayout&&D.preview&&['desk','cards'].includes(el.dataset.previewLayout)){previewLayout=el.dataset.previewLayout;paint('example');return;}
 if(el.dataset.previewItem&&D.preview&&D.preview.items.some(i=>i.id===el.dataset.previewItem)){previewItem=el.dataset.previewItem;const panel=$('example-detail');if(panel)panel.innerHTML=exampleDetail(D.preview,D.preview.items.find(i=>i.id===previewItem),true);for(const b of document.querySelectorAll('[data-preview-item]'))b.setAttribute('aria-pressed',String(b.dataset.previewItem===previewItem));return;}
 if(el.dataset.previewCopy&&D.preview){const item=D.preview.items.find(x=>x.id===el.dataset.previewCopy);if(item&&item.draft)toast(await copyText(L(item.draft))?t('copied'):t('copy_fail'));return;}
/*LAYOUT:end*/
 const act=el.dataset.act;
 if(act==='scroll-qs'){const s=$('qs');if(s)s.scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(act==='zip'){save(D.zip.root+'-'+S.version+'.zip',new Blob([makeZip(zipEntries(D))],{type:'application/zip'}));toast(t('zip_done'));return;}
 if(act==='copy-prompt'){toast(await copyText(L(D.overview.prompt))?t('copied'):t('copy_fail'));return;}
 if(el.hasAttribute('data-additional-prompt')){const p=D.overview.additionalPrompts[Number(el.dataset.additionalPrompt)];if(p)toast(await copyText(L(p.prompt))?t('copied'):t('copy_fail'));return;}
 if(el.id==='dlg-close'){$('dlg').close();return;}
 if(el.id==='dlg-copy'&&current){toast(await copyText(D.files[current].text)?t('copied'):t('copy_fail'));return;}
 if(el.id==='dlg-dl'&&current){const f=D.files[current];save(current.split('/').pop(),new Blob([fileBytes(f)],{type:f.encoding==='base64'?'application/octet-stream':'text/plain;charset=utf-8'}));return;}
});
document.addEventListener('change',ev=>{if(ev.target.id==='scope'){scope=ev.target.value;paint('overview');const s=$('scope');if(s)s.focus();}});
document.addEventListener('keydown',ev=>{
 const b=ev.target.closest&&ev.target.closest('[role=tab]');if(!b)return;
 const i=TABS.indexOf(b.dataset.tab);let n=null;
 if(ev.key==='ArrowRight')n=TABS[(i+1)%TABS.length];if(ev.key==='ArrowLeft')n=TABS[(i+TABS.length-1)%TABS.length];
 if(n){ev.preventDefault();activate(n,true);document.querySelector('[data-tab="'+n+'"][role=tab]').focus();}
});
window.addEventListener('resize',()=>{if(F)fitCanvas();});
window.addEventListener('hashchange',()=>activate(location.hash.slice(1),false));
tab=location.hash.slice(1)||'overview';
render();
})();
</script>
</body>
</html>
